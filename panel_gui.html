<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LaTeX 笔记工具集</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1c2128;
    --line: #21262d;
    --line-2: #30363d;
    --fg: #e6edf3;
    --fg-dim: #8b949e;
    --fg-faint: #6e7681;
    --accent: #58a6ff;
    --ok: #3fb950;
    --warn: #d29922;
    --danger: #f85149;
    --mono: ui-monospace, "Cascadia Mono", "Consolas", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 20px;
    padding: 14px 24px;
    background: rgba(13, 17, 23, .92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .brand h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .2px; }
  .brand .path {
    font: 11px/1.4 var(--mono);
    color: var(--fg-faint);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 46vw;
  }
  .search {
    margin-left: auto; position: relative;
  }
  .search input {
    width: 260px; padding: 7px 12px 7px 32px;
    background: var(--panel); color: var(--fg);
    border: 1px solid var(--line-2); border-radius: 6px;
    font-size: 13px; outline: none;
    transition: border-color .15s, width .15s;
  }
  .search input:focus { border-color: var(--accent); width: 320px; }
  .search::before {
    content: "⌕"; position: absolute; left: 10px; top: 50%;
    transform: translateY(-52%); color: var(--fg-faint); font-size: 15px;
  }

  main { padding: 26px 24px 80px; max-width: 1560px; margin: 0 auto; }

  .group { margin-bottom: 30px; }
  .group-head {
    display: flex; align-items: center; gap: 10px;
    margin: 0 0 12px 2px;
  }
  .group-head h2 {
    margin: 0; font-size: 12px; font-weight: 600;
    letter-spacing: 1.4px; text-transform: uppercase; color: var(--fg-dim);
  }
  .group-head .rule { flex: 1; height: 1px; background: var(--line); }

  .grid {
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
  }
  /* display:flex 会压过 UA 的 [hidden]{display:none}，必须显式声明，
     否则搜索时同组内不匹配的卡片藏不掉 */
  .card[hidden], .group[hidden] { display: none !important; }

  .card {
    display: flex; flex-direction: column; gap: 10px;
    padding: 14px 16px 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    transition: border-color .15s, background .15s, transform .08s;
  }
  .card:hover { border-color: var(--line-2); background: var(--panel-2); }
  .card.active { border-color: rgba(63, 185, 80, .45); }
  .card.done { border-color: rgba(210, 153, 34, .35); }
  .card.missing { opacity: .55; }

  .card-top { display: flex; align-items: baseline; gap: 9px; }
  .badge {
    flex: none;
    font: 11px/1 var(--mono); color: var(--fg-dim);
    border: 1px solid var(--line-2); border-radius: 4px;
    padding: 3px 6px; min-width: 22px; text-align: center;
  }
  .card.active .badge { color: var(--ok); border-color: rgba(63,185,80,.5); }
  .card h3 {
    margin: 0; font-size: 13.5px; font-weight: 600; line-height: 1.45;
    flex: 1; min-width: 0;
  }
  .star { color: var(--warn); font-size: 12px; flex: none; }

  .script {
    margin: 0; font: 11px/1.4 var(--mono); color: var(--fg-faint);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .desc { margin: 0; font-size: 12.5px; color: var(--fg-dim); }

  .args { display: flex; }
  .args input {
    width: 100%; padding: 6px 9px;
    background: #0d1117; color: var(--fg);
    border: 1px solid var(--line-2); border-radius: 5px;
    font: 12px/1.4 var(--mono); outline: none;
  }
  .args input:focus { border-color: var(--accent); }

  .card-foot {
    display: flex; align-items: center; gap: 8px;
    margin-top: auto; padding-top: 4px;
  }
  .status {
    display: flex; align-items: center; gap: 6px;
    font-size: 11.5px; color: var(--fg-faint); min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .status i {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--fg-faint); flex: none;
  }
  .card.active .status { color: var(--ok); }
  .card.active .status i { background: var(--ok); box-shadow: 0 0 0 3px rgba(63,185,80,.15); }
  .card.done .status { color: var(--warn); }
  .card.done .status i { background: var(--warn); }
  .card.err .status { color: var(--danger); }
  .card.err .status i { background: var(--danger); }

  .actions { margin-left: auto; display: flex; gap: 6px; flex: none; }
  button {
    font: 12px/1 inherit; padding: 6px 12px; border-radius: 6px;
    border: 1px solid var(--line-2); background: transparent; color: var(--fg-dim);
    cursor: pointer; transition: all .13s;
  }
  button:hover { color: var(--fg); border-color: var(--fg-faint); }
  button.primary { color: #0d1117; background: var(--fg-dim); border-color: transparent; font-weight: 600; }
  button.primary:hover { background: var(--fg); }
  button.danger { color: var(--danger); border-color: rgba(248,81,73,.35); }
  button.danger:hover { background: rgba(248,81,73,.1); border-color: var(--danger); }
  button:disabled { opacity: .4; cursor: not-allowed; }

  /* 输出抽屉 */
  #drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 92vw);
    display: flex; flex-direction: column;
    background: #0b0f14; border-left: 1px solid var(--line-2);
    box-shadow: -24px 0 48px rgba(0,0,0,.55);
    transform: translateX(100%); transition: transform .22s ease;
    z-index: 40;
  }
  #drawer.open { transform: translateX(0); }
  .drawer-head {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 18px; border-bottom: 1px solid var(--line);
  }
  .drawer-head h2 { margin: 0; font-size: 13px; font-weight: 600; }
  .drawer-head .sub { font: 11px/1 var(--mono); color: var(--fg-faint); }
  .drawer-head .spacer { flex: 1; }
  #out {
    flex: 1; margin: 0; padding: 16px 18px;
    overflow: auto; font: 12px/1.65 var(--mono);
    color: #c9d1d9; white-space: pre-wrap;
    /* 长路径里没有断行机会（反斜杠不算），必须允许任意处折行，否则右侧被切掉 */
    overflow-wrap: anywhere;
    tab-size: 4;
  }
  #out.empty { color: var(--fg-faint); }

  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px);
    padding: 9px 18px; border-radius: 7px;
    background: var(--panel-2); border: 1px solid var(--line-2);
    font-size: 12.5px; color: var(--fg);
    opacity: 0; pointer-events: none; transition: all .2s;
    z-index: 60; max-width: 70vw;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.bad { border-color: rgba(248,81,73,.5); color: #ffb4ae; }

  .empty-hint {
    color: var(--fg-faint); font-size: 13px; padding: 30px 4px;
  }
  @media (max-width: 640px) {
    header { flex-wrap: wrap; gap: 10px; }
    .search { margin-left: 0; width: 100%; }
    .search input { width: 100%; }
    .search input:focus { width: 100%; }
    main { padding: 18px 14px 70px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>LaTeX 笔记工具集</h1>
    <div class="path" id="ws">…</div>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="搜索工具 · 按 / 聚焦" autocomplete="off">
  </div>
</header>

<main id="main">
  <div class="empty-hint" id="loading">正在读取工具列表…</div>
</main>

<aside id="drawer">
  <div class="drawer-head">
    <h2 id="dtitle">输出</h2>
    <span class="sub" id="dsub"></span>
    <span class="spacer"></span>
    <button id="drefresh">刷新</button>
    <button id="dclose">关闭</button>
  </div>
  <pre id="out" class="empty">（还没有输出）</pre>
</aside>

<div id="toast"></div>

<script>
(function () {
  "use strict";
  const TOKEN = "__TOKEN__";
  let state = null;
  let built = false;
  let lastError = "";
  const argValues = {};      // id -> 输入框内容，重绘不丢
  let drawerId = null;       // 当前查看输出的工具 id
  let timer = null;

  const $ = (sel) => document.querySelector(sel);

  function toast(msg, bad) {
    const el = $("#toast");
    el.textContent = msg;
    el.className = "show" + (bad ? " bad" : "");
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.className = ""; }, 2600);
  }

  async function api(path, body) {
    const opt = body
      ? { method: "POST", headers: { "Content-Type": "application/json", "X-Panel-Token": TOKEN }, body: JSON.stringify(body) }
      : { method: "GET" };
    const r = await fetch(path, opt);
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
    return data;
  }

  function relTime(ts) {
    const s = Math.max(0, Math.round(Date.now() / 1000 - ts));
    if (s < 60) return s + " 秒前";
    if (s < 3600) return Math.round(s / 60) + " 分钟前";
    return Math.round(s / 3600) + " 小时前";
  }

  function groupOf(id) {
    const t = state.tools.find((x) => x.id === id);
    return t ? t.group : "";
  }

  function build() {
    const groups = new Map();
    for (const t of state.tools) {
      if (!groups.has(t.group)) groups.set(t.group, []);
      groups.get(t.group).push(t);
    }
    const main = $("#main");
    main.innerHTML = "";
    for (const [name, tools] of groups) {
      const sec = document.createElement("section");
      sec.className = "group";
      sec.innerHTML = `<div class="group-head"><h2>${esc(name)}</h2><div class="rule"></div></div>`;
      const grid = document.createElement("div");
      grid.className = "grid";
      for (const t of tools) grid.appendChild(card(t));
      sec.appendChild(grid);
      main.appendChild(sec);
    }
    const hint = document.createElement("div");
    hint.className = "empty-hint";
    hint.id = "nomatch";
    hint.textContent = "没有匹配的工具。";
    hint.hidden = true;
    main.appendChild(hint);
    built = true;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function card(t) {
    const el = document.createElement("article");
    el.className = "card" + (t.exists ? "" : " missing");
    el.dataset.id = t.id;
    el.dataset.search = (t.title + " " + t.desc + " " + t.script + " " + t.group).toLowerCase();

    const args = t.oneoff
      ? `<div class="args"><input id="arg-${t.id}" placeholder="追加参数（可空）" value="${esc(t.defaultArgs)}"></div>`
      : "";

    el.innerHTML = `
      <div class="card-top">
        <span class="badge">${esc(t.id)}</span>
        <h3>${esc(t.title)}</h3>
        ${t.submit ? '<span class="star" title="提交项">★</span>' : ""}
      </div>
      <p class="script">${esc(t.script)}</p>
      <p class="desc">${esc(t.desc)}</p>
      ${args}
      <div class="card-foot">
        <span class="status"><i></i><span class="text">${t.exists ? "未启动" : "脚本缺失"}</span></span>
        <div class="actions">
          <button data-act="output" hidden>输出</button>
          <button class="danger" data-act="stop" hidden>停止</button>
          <button class="primary" data-act="run" ${t.exists ? "" : "disabled"}>启动</button>
        </div>
      </div>`;

    el.addEventListener("click", async (ev) => {
      const btn = ev.target.closest("button");
      if (!btn) return;
      const act = btn.dataset.act;
      try {
        if (act === "run") {
          const input = el.querySelector("input");
          const extra = input ? input.value : "";
          await api("/api/run", { id: t.id, args: extra });
          toast((t.oneoff ? "已开始运行：" : "已打开控制台窗口：") + t.title);
          await load();
        } else if (act === "stop") {
          const r = await api("/api/stop", { id: t.id });
          toast(r.message || "已停止");
          await load();
        } else if (act === "output") {
          await openDrawer(t.id, t.title);
        }
      } catch (e) {
        toast(e.message, true);
      }
    });
    return el;
  }

  function apply() {
    if (!built) { build(); }
    for (const t of state.tools) {
      const el = document.querySelector(`.card[data-id="${t.id}"]`);
      if (!el) continue;
      const run = state.runs[t.id];
      const text = el.querySelector(".status .text");
      const runBtn = el.querySelector('[data-act="run"]');
      const stopBtn = el.querySelector('[data-act="stop"]');
      const outBtn = el.querySelector('[data-act="output"]');
      el.classList.remove("active", "done", "err");

      if (run && run.alive) {
        el.classList.add("active");
        text.textContent = (run.mode === "console" ? "控制台运行中" : "运行中") + " · " + relTime(run.started);
        runBtn.disabled = true;
        runBtn.textContent = "运行中";
        stopBtn.hidden = false;
        outBtn.hidden = !run.hasOutput;
      } else if (run) {
        const rc = run.returncode;
        el.classList.add(rc === 0 ? "done" : "err");
        text.textContent = "已结束 · 退出码 " + (rc === null ? "?" : rc);
        runBtn.disabled = !t.exists;
        runBtn.textContent = "重新运行";
        stopBtn.hidden = true;
        outBtn.hidden = !run.hasOutput;
      } else {
        text.textContent = t.exists ? "未启动" : "脚本缺失";
        runBtn.disabled = !t.exists;
        runBtn.textContent = "启动";
        stopBtn.hidden = true;
        outBtn.hidden = true;
      }
    }
    applyFilter();
  }

  function applyFilter() {
    const q = $("#q").value.trim().toLowerCase();
    let shown = 0;
    document.querySelectorAll(".card").forEach((el) => {
      const hit = !q || el.dataset.search.includes(q);
      el.hidden = !hit;
      if (hit) shown++;
    });
    document.querySelectorAll(".group").forEach((sec) => {
      const any = [...sec.querySelectorAll(".card")].some((c) => !c.hidden);
      sec.hidden = !any;
    });
    const nm = $("#nomatch");
    if (nm) nm.hidden = shown > 0 || !built;
  }

  async function load() {
    try {
      state = await api("/api/state");
      $("#ws").textContent = state.workspace;
      apply();
    } catch (e) {
      if (lastError !== e.message) { toast("读不到状态：" + e.message, true); lastError = e.message; }
    }
  }

  async function openDrawer(id, title) {
    drawerId = id;
    $("#dtitle").textContent = title;
    $("#drawer").classList.add("open");
    await refreshDrawer();
  }

  async function refreshDrawer() {
    if (!drawerId) return;
    try {
      const d = await api("/api/output?id=" + encodeURIComponent(drawerId));
      const out = $("#out");
      out.textContent = d.lines.length ? d.lines.join("\n") : "（还没有输出）";
      out.classList.toggle("empty", !d.lines.length);
      out.scrollTop = out.scrollHeight;
      $("#dsub").textContent = d.lines.length + " 行";
    } catch (e) {
      toast(e.message, true);
    }
  }

  $("#q").addEventListener("input", applyFilter);
  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement.tagName !== "INPUT") {
      e.preventDefault();
      $("#q").focus();
      $("#q").select();
    } else if (e.key === "Escape") {
      if ($("#drawer").classList.contains("open")) $("#drawer").classList.remove("open");
      else { $("#q").value = ""; applyFilter(); }
    }
  });
  $("#dclose").addEventListener("click", () => $("#drawer").classList.remove("open"));
  $("#drefresh").addEventListener("click", refreshDrawer);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { clearInterval(timer); timer = null; }
    else if (!timer) { load(); timer = setInterval(load, 1500); }
  });

  load();
  timer = setInterval(load, 1500);
})();
</script>
</body>
</html>
