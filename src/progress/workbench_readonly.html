<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>写作工作台 · 只读快照</title>
<style>
:root{color-scheme:light;--bg:#f4f6fa;--panel:#fff;--ink:#243047;--muted:#68758a;--line:#dce2ec;--accent:#315fd4;--soft:#edf2ff;--warn:#8c591b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,'Microsoft YaHei',sans-serif}body.dark{color-scheme:dark;--bg:#161c27;--panel:#202838;--ink:#e0e7f2;--muted:#a5b2c8;--line:#364257;--accent:#9ab7ff;--soft:#2a3855;--warn:#edc389}header{padding:22px 30px 16px;border-bottom:1px solid var(--line);background:var(--panel)}h1{font-size:23px;margin:0}h2{font-size:17px;margin:0 0 10px}h3{font-size:14px;margin:15px 0 8px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.sub,.muted{color:var(--muted)}.notice{margin-top:10px;color:var(--warn);font-size:12px}.layout{display:grid;grid-template-columns:minmax(380px,1.2fr) minmax(350px,1fr);gap:16px;max-width:1500px;margin:auto;padding:20px 30px}.toolbar,.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}.toolbar{grid-column:1/-1}.controls,.tabs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.tabs{margin:14px 0 10px}button,input,select{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 11px}button{cursor:pointer}button:hover{border-color:var(--accent)}button.active{background:var(--soft);color:var(--accent);border-color:var(--accent)}input{flex:1;min-width:180px}.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.stat{border:1px solid var(--line);padding:4px 9px;border-radius:6px;color:var(--muted);font-size:12px}.group{margin:0 0 18px}.group-title{padding:5px 0;border-bottom:1px solid var(--line);font-weight:600}.unit{display:block;text-align:left;width:100%;margin-top:7px;padding:10px;background:var(--panel)}.unit.selected{background:var(--soft);border-color:var(--accent)}.unit-title{font-weight:600}.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}.badge{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--bg);color:var(--muted)}.warn{color:var(--warn)}.detail{position:sticky;top:16px;align-self:start;overflow-wrap:anywhere}.pair{display:grid;grid-template-columns:110px 1fr;gap:5px;margin:5px 0}.pair dt{color:var(--muted)}.pair dd{margin:0;white-space:pre-wrap}.entry{border-left:2px solid var(--line);padding:6px 10px;margin:7px 0;white-space:pre-wrap;overflow-wrap:anywhere}pre{white-space:pre-wrap;word-break:break-word;font:12px/1.6 ui-monospace,monospace;background:var(--bg);border-radius:6px;padding:10px;margin:6px 0}details{margin-top:10px}summary{cursor:pointer;color:var(--accent)}.empty{color:var(--muted);padding:18px 0}#conflictsPanel{grid-column:1/-1}#conflictsPanel[hidden]{display:none}label{font-size:12px;color:var(--muted)}@media(max-width:850px){.layout{display:block;padding:14px}.card{margin-top:14px}.detail{position:static}header{padding:18px}.toolbar{padding:12px}.pair{grid-template-columns:95px 1fr}}
</style></head><body>
<header><div class="top"><div><h1>写作工作台 <span class="muted">/ 只读原型</span></h1><div class="sub" id="snapshot"></div></div><button id="themeToggle" type="button">切换暗色</button></div><div class="notice">仅展示本地快照，不联网、不保存审核、不修改 TeX 或资料。永久 book_id 尚未建立；当前标识仅用于原型定位。未检查 ≠ 已完成。</div></header>
<main class="layout"><section class="toolbar"><div class="controls"><label for="bookSelect">书籍</label><select id="bookSelect" aria-label="书籍"></select><input id="search" type="search" placeholder="搜索编号、标题、路径、疑点与 TODO" aria-label="搜索"><button id="conflictsToggle" type="button">绑定冲突</button></div><nav class="tabs" aria-label="工作视图"><button data-view="body" class="active">正文整理</button><button data-view="proof">证明回填</button><button data-view="summary">总结导引</button></nav><div class="controls"><label for="statusFilter">阶段状态</label><select id="statusFilter"><option value="all">全部状态</option><option>未检查</option><option>进行中</option><option>待修订</option><option>有疑点</option><option>待补</option><option>本轮完成</option><option>本轮通过</option><option>不适用</option><option>未登记</option></select><label for="issueFilter">疑点</label><select id="issueFilter"><option value="all">全部单位</option><option value="open">有未决疑点</option><option value="todo">有源码 TODO</option><option value="conflict">有绑定冲突</option></select></div><div id="stats" class="stats"></div></section>
<section class="card"><h2 id="listTitle">正文单位</h2><div id="unitList"></div></section><aside class="card detail"><h2>单位详情</h2><div id="detail"><div class="empty">选择左侧单位查看绑定与审核依据。</div></div></aside><section class="card" id="conflictsPanel" hidden><h2>冲突与待确认项</h2><div id="conflictList"></div></section></main>
<script id="workbench-data" type="application/json">__WORKBENCH_DATA__</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('workbench-data').textContent);
const $=id=>document.getElementById(id), books=Array.isArray(DATA.books)?DATA.books:[];
const names={body:'正文整理',source:'来源对照',math:'数学审核',proof:'证明回填',summary:'总结导引'};
let view='body', selected=null;
function text(value){if(value===undefined||value===null)return '未登记';return typeof value==='object'?JSON.stringify(value,null,2):String(value)}
function node(tag,value,cls){const el=document.createElement(tag);if(value!==undefined)el.textContent=text(value);if(cls)el.className=cls;return el}
function arr(value){return Array.isArray(value)?value:[]}
function book(){return books[Number($('bookSelect').value)]||{units:[],conflicts:[]}}
function status(u,key){const value=(u.statuses||{})[key];return typeof value==='object'&&value!==null?text(value.status||value.state||value.label):value?text(value):key==='summary'?'未登记':'未检查'}
function unresolved(u){return arr(u.issues).filter(i=>!['已解决','resolved','closed'].includes(i.status||i.state))}
function unitName(u){return [u.display_id||u.id,u.title||u.name].filter(Boolean).join(' · ')}
function groupName(u){return [text(u.chapter||'章未登记'),text(u.section||'§未登记')].join(' / ')}
function conflicts(){const current=book(), seen=new Set();return [...arr(current.conflicts),...arr(DATA.conflicts).filter(c=>c.book_id===current.book_id)].filter(c=>{const scoped={...c,book_id:current.book_id};const key=JSON.stringify(Object.keys(scoped).sort().map(k=>[k,scoped[k]]));if(seen.has(key))return false;seen.add(key);return true})}
function unitConflict(u){return arr(u.conflicts).length||conflicts().some(c=>[c.unit_id,c.id,c.display_id].some(id=>id&&(id===u.id||id===u.display_id)))}
function pair(parent,label,value){const dl=node('dl',undefined,'pair');dl.append(node('dt',label),node('dd',value));parent.append(dl)}
function renderDetail(u){const panel=$('detail');panel.replaceChildren();if(!u){panel.append(node('div','选择左侧单位查看绑定与审核依据。','empty'));return}panel.append(node('h3',unitName(u)));pair(panel,'单位类型',u.kind||u.unit_kind);pair(panel,'临时书籍标识',book().book_id);pair(panel,'本地章 / §',groupName(u));pair(panel,'TeX 路径',u.tex_path);pair(panel,'Materials 路径',u.materials_path);pair(panel,'稿件存在性',u.content_state);pair(panel,'正文稿路径',u.body_path||(u.materials_path?u.materials_path+'/body.md':undefined));pair(panel,'证明稿路径',u.proof_path||(u.materials_path?u.materials_path+'/proof.md':undefined));pair(panel,'审核记录路径',u.review_path);panel.append(node('h3','独立审核状态（不由稿件字数推断）'));Object.keys(names).forEach(k=>pair(panel,names[k],status(u,k)));panel.append(node('h3','Source 与绑定依据'));panel.append(node('pre',u.source_info||book().source_info||book().source||'未登记来源信息'));if(u.binding_provenance)panel.append(node('pre',u.binding_provenance));panel.append(node('h3','审核结论（独立于疑点）'));panel.append(node('pre',u.conclusion||'未登记审核结论'));panel.append(node('h3','审核疑点'));const issues=arr(u.issues);if(!issues.length)panel.append(node('div','没有已登记疑点；不代表审核通过。','muted'));issues.forEach(i=>panel.append(node('div',i,'entry')));panel.append(node('h3','源码 TODO（只读，不自动改写）'));if(!arr(u.todos).length)panel.append(node('div','未发现或未登记源码 TODO。','muted'));arr(u.todos).forEach(t=>panel.append(node('div',t,'entry')));panel.append(node('h3','legacy 候选（历史，不升级为审核通过）'));const legacy=u.legacy_candidates||u.legacy||[];panel.append(node('pre',redact(legacy)));const privateDetails=node('details');privateDetails.append(node('summary','查看私有历史原文（默认隐藏，仅本机）'));privateDetails.addEventListener('toggle',()=>{if(privateDetails.open&&!privateDetails.querySelector('pre'))privateDetails.append(node('pre',legacy))});panel.append(privateDetails);if(unitConflict(u))panel.append(node('div','该单位存在绑定冲突，请查看冲突面板；不会自动选定权威记录。','notice'))}
function redact(value){if(Array.isArray(value))return value.map(redact);if(value&&typeof value==='object'){const result={};for(const [k,v]of Object.entries(value))result[k]=/raw|note|remark|comment|private|备注/i.test(k)?'私有字段已隐藏':redact(v);return result}return value}
function renderConflicts(){const target=$('conflictList');target.replaceChildren();const list=conflicts();$('conflictsToggle').textContent='绑定冲突 · '+list.length;if(!list.length)target.append(node('div','本快照未登记冲突；不等于原书逐目核定完成。','empty'));list.forEach(c=>target.append(node('pre',redact(c))));const legacy=node('details');legacy.append(node('summary','legacy 全局保留层（历史候选，不自动迁移）'));legacy.append(node('pre',redact(DATA.legacy||{})));target.append(legacy)}
function render(){const b=book(), units=arr(b.units), query=$('search').value.trim().toLowerCase(), filter=$('statusFilter').value, issue=$('issueFilter').value;const filtered=units.filter(u=>(!query||(unitName(u)+' '+JSON.stringify(redact(u))).toLowerCase().includes(query))&&(filter==='all'||status(u,view)===filter)&&(issue==='all'||issue==='open'&&unresolved(u).length||issue==='todo'&&arr(u.todos).length||issue==='conflict'&&unitConflict(u)));$('listTitle').textContent=names[view]+' · '+filtered.length+' / '+units.length+' 个绑定单位';$('stats').replaceChildren();const keys=view==='body'?['body','source','math']:[view];keys.filter(k=>k!=='summary').forEach(k=>{const checked=units.filter(u=>['本轮完成','本轮通过'].includes(status(u,k))).length, pending=units.filter(u=>['未检查','未登记'].includes(status(u,k))).length;$('stats').append(node('span',names[k]+'：明确确认 '+checked+'；未检查/未登记 '+pending,'stat'))});$('stats').append(node('span','未决疑点 '+units.reduce((n,u)=>n+unresolved(u).length,0)+' · 源码 TODO '+units.reduce((n,u)=>n+arr(u.todos).length,0),'stat'));if(view==='summary')$('stats').append(node('span','总结以章/§登记；当前仅展示绑定上下文，无现行记录时显示未登记，不计算逐目完成率。','stat'));const list=$('unitList');list.replaceChildren();if(!filtered.length)list.append(node('div','没有匹配的绑定单位。','empty'));const groups=new Map();filtered.forEach(u=>{const key=groupName(u);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(u)});groups.forEach((items,label)=>{const section=node('section',undefined,'group');section.append(node('div',label,'group-title'));let unitContainer=section;if(view==='summary'){const summaryRow=node('button','章/§总结：未登记 · 关联 '+items.length+' 个绑定单位','summary-row');summaryRow.type='button';const related=node('div');related.hidden=true;summaryRow.addEventListener('click',()=>{related.hidden=!related.hidden;$('detail').replaceChildren(node('h3',label+' · 总结导引'),node('div','当前无现行章/§总结记录。下列单位仅为绑定上下文，不作为逐目总结完成率。','muted'));items.forEach(u=>{const link=node('button',unitName(u),'unit');link.type='button';link.addEventListener('click',()=>renderDetail(u));$('detail').append(link)})});section.append(summaryRow,related);unitContainer=related}items.forEach(u=>{const button=node('button',undefined,'unit'+(selected===u?' selected':''));button.type='button';button.dataset.unitId=u.id||u.display_id||'';button.append(node('div',unitName(u),'unit-title'));const badges=node('div',undefined,'badges');keys.forEach(k=>badges.append(node('span',names[k]+'：'+status(u,k),'badge')));if(unresolved(u).length)badges.append(node('span','未决疑点 '+unresolved(u).length,'badge warn'));if(arr(u.todos).length)badges.append(node('span','TODO '+arr(u.todos).length,'badge'));if(unitConflict(u))badges.append(node('span','绑定冲突','badge warn'));button.append(badges);button.addEventListener('click',()=>{selected=u;render();renderDetail(u)});unitContainer.append(button)});list.append(section)});renderConflicts()}
books.forEach((b,i)=>{const option=node('option',b.title||b.name||b.book_id);option.value=String(i);$('bookSelect').append(option)});
$('snapshot').textContent='快照日期：'+text(DATA.snapshot_at||DATA.generated_at||DATA.snapshot_date||'未登记')+' · 审核权威：Materials / review.md · JSON 为只读缓存';
$('bookSelect').addEventListener('change',()=>{selected=null;renderDetail(null);render()});$('search').addEventListener('input',render);$('statusFilter').addEventListener('change',render);$('issueFilter').addEventListener('change',render);document.querySelectorAll('[data-view]').forEach(el=>el.addEventListener('click',()=>{view=el.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===el));render()}));$('conflictsToggle').addEventListener('click',()=>{$('conflictsPanel').hidden=!$('conflictsPanel').hidden});function setTheme(dark){document.body.classList.toggle('dark',dark);$('themeToggle').textContent=dark?'切换亮色':'切换暗色'}try{setTheme(localStorage.getItem('workbench.theme')==='dark')}catch{}$('themeToggle').addEventListener('click',()=>{const dark=!document.body.classList.contains('dark');setTheme(dark);try{localStorage.setItem('workbench.theme',dark?'dark':'light')}catch{}});render();
</script></body></html>
