<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>写作进度追踪表</title>
<style>
:root{
  --bg:#1c1c1b; --bg2:#252524; --bg3:#313130;
  --fg:#f0f0ee; --fg2:#b4b2a9; --fg3:#888780;
  --bd:rgba(255,255,255,.13); --bd2:rgba(255,255,255,.26);
  --blue:#4a9be8; --gray-mid:#8b8982; --gray-dark:#5f5e5a; --orange:#ef9f27;
  --green:#639922;
}
html[data-theme="light"]{
  --bg:#ffffff; --bg2:#f5f5f4; --bg3:#e8e8e6;
  --fg:#1a1a1a; --fg2:#5f5e5a; --fg3:#8b8982;
  --bd:rgba(0,0,0,.12); --bd2:rgba(0,0,0,.25);
  --blue:#2f7fca; --gray-mid:#a9a7a0; --gray-dark:#c4c2ba; --orange:#c9821a;
  --green:#4f7c1b;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
/* hidden 属性必须压得住作者样式里的 display。
   浏览器只在「没有别的 display 规则」时才让 hidden 生效；像 #viewer 那样写了
   display:flex 的元素，hidden 会被无视 —— 结果它一直盖在整页之上，连「关闭」
   按钮都失效（关闭只是把 hidden 设回 true，而它本来就是 true）。 */
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  font-size:13px; line-height:1.5;
}
.mono{font-family:"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:12px;color:var(--fg);background:transparent;
  border:.5px solid var(--bd2);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{background:var(--bg2)}
button.pri{background:var(--blue);border-color:var(--blue);color:#fff}
button.pri:hover{filter:brightness(1.08)}
button.on{background:var(--bg3)}
.ico{width:14px;height:14px;display:inline-block;vertical-align:-2px}
.ico-btn{display:inline-flex;align-items:center;gap:5px}

/* 顶栏 */
#topbar{display:flex;align-items:center;gap:10px;padding:8px 16px;
  border-bottom:.5px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:20}
#topbar .title{font-size:14px;font-weight:500;margin-right:4px}
#topbar .sp{flex:1}
#svc{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--fg2)}
#svc .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
#svc.off .dot{background:var(--orange)}
.tstamp{font-size:12px;color:var(--fg3)}

/* 布局 */
.layout{display:flex;min-height:calc(100vh - 45px)}
nav{width:150px;flex:0 0 150px;border-right:.5px solid var(--bd);padding:10px 8px}
nav .item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:7px;
  cursor:pointer;font-size:13px;color:var(--fg2);margin-bottom:4px}
nav .item:hover{background:var(--bg2)}
nav .item.on{background:var(--bg2);color:var(--fg);font-weight:500}
main{flex:1;min-width:0;padding:16px 20px 40px}
.sec-h{font-size:13px;font-weight:500;color:var(--fg2);margin:0 0 10px}
.card{background:var(--bg2);border-radius:10px;padding:14px 16px}
.card+.card{margin-top:12px}

/* 进度条 */
.bar{display:flex;gap:2px;height:9px;border-radius:3px;overflow:hidden;background:var(--bg3)}
.bar span{display:block;min-width:0}
.sw{background:var(--blue)} .se{background:var(--gray-mid)} .sm{background:var(--gray-dark)}

/* 续写区 */
#resume{margin-bottom:14px}
#resume .row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;cursor:pointer}
#resume .row:hover{background:var(--bg3)}
#resume .rname{color:var(--fg);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#resume .rnote{font-size:12px;color:var(--fg3);flex:0 0 auto}
#resume .stale{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;padding:2px 8px;border-radius:20px;background:var(--bg3);color:var(--orange)}

/* 合计卡 */
#globalCard .g-row{display:flex;flex-wrap:wrap;gap:18px;margin-bottom:10px}
.metric{min-width:78px}
.metric .k{font-size:12px;color:var(--fg3)}
.metric .v{font-size:20px;font-weight:500;line-height:1.25}

/* 笔记卡片 */
#notesGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ncard{background:var(--bg2);border-radius:10px;padding:14px 16px;cursor:pointer;
  border:.5px solid transparent}
.ncard:hover{border-color:var(--bd2)}
.ncard .hd{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.ncard .nm{font-size:14px;font-weight:500;flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.ncard .pc{font-size:15px;font-weight:500}
.ncard .sub{font-size:12px;color:var(--fg3);margin-bottom:9px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ncard .nums{display:flex;flex-wrap:wrap;gap:12px;margin-top:9px;font-size:12px;color:var(--fg2)}
.ncard .nums b{font-weight:500;color:var(--fg)}
.ncard .flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.flag{font-size:11px;padding:2px 7px;border-radius:20px;background:var(--bg3);color:var(--fg3)}
.flag.warn{color:var(--orange)}

/* 排序 */
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.sel{display:inline-flex;border:.5px solid var(--bd2);border-radius:6px;overflow:hidden}
.sel button{border:0;border-radius:0;padding:5px 11px}
.sel button.on{background:var(--bg3);font-weight:500}

/* 笔记选择器：笔记少时平铺成按钮，多了收成一个下拉 + 前后切换 */
#noteSel .sel{flex-wrap:wrap;max-width:100%}
.note-pick{display:inline-flex;align-items:center;gap:6px;min-width:0;max-width:100%}
.note-pick select{background:var(--bg3);color:var(--fg);border:.5px solid var(--bd2);
  border-radius:6px;padding:5px 8px;font-family:inherit;font-size:13px;max-width:340px}
.note-step{width:27px;height:27px;flex:0 0 27px;display:inline-flex;align-items:center;
  justify-content:center;border:.5px solid var(--bd2);border-radius:6px;background:transparent;
  color:var(--fg2);cursor:pointer;font-size:14px;line-height:1;padding:0}
.note-step:hover:not(:disabled){background:var(--bg3);color:var(--fg)}
.note-step:disabled{opacity:.35;cursor:default}

/* 明细 */
#detailWrap{display:flex;gap:16px;align-items:flex-start}
#tree{flex:1;min-width:0;background:var(--bg2);border-radius:10px;padding:6px}
#panel{flex:0 0 320px;background:var(--bg2);border-radius:10px;padding:14px 16px;
  position:sticky;top:60px}
.nrow{display:flex;align-items:center;gap:8px;border-radius:6px;cursor:pointer;
  padding:0 8px;height:30px}
.nrow:hover{background:var(--bg3)}
.nrow.sel{background:var(--bg3);box-shadow:inset 2px 0 0 var(--blue)}
.nrow.lv0{height:34px;font-weight:500}
.nrow .caret{width:12px;height:12px;flex:0 0 12px;color:var(--fg3);transition:transform .12s}
.nrow.open .caret{transform:rotate(90deg)}
.nrow .caret.leaf{visibility:hidden}
.nrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrow .cnt{font-size:12px;color:var(--fg3);flex:0 0 auto}
.nrow .mini{flex:0 0 56px;height:6px;gap:1px}
.nrow .mini span{border-radius:1px}
.st{background:var(--orange)}
.legend .li .mk{width:14px;height:14px;flex:0 0 14px}
.legend .li .cbx{margin:0}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.dot.w{background:var(--blue)}
.dot.e{background:transparent;border:1.5px solid var(--gray-mid)}
.dot.m{background:transparent;border:1.5px solid var(--gray-dark)}
.marks{display:flex;gap:9px;flex:0 0 auto;align-items:center}
.mk{width:14px;height:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.mk:hover{opacity:.72}
.kids{margin-left:14px;border-left:.5px solid var(--bd);padding-left:2px}
.pdot{width:6px;height:6px;border-radius:50%;flex:0 0 6px}
.pdot.hard{background:#e24b4a}
.pdot.soft{background:var(--orange)}
/* 章行上的「整章待补」标记：未标记时是淡的小旗，标记后变橙色圆点 */
.cmk{width:16px;height:16px;flex:0 0 16px;cursor:pointer;display:flex;
  align-items:center;justify-content:center;opacity:.5}
.cmk:hover{opacity:1}
.cmk.on{opacity:1}
/* 行内的备注 / 未完成待办小标记 */
.lflag{display:inline-flex;align-items:center;flex:0 0 auto;padding:0 2px;
  color:var(--fg3);font-size:10px;line-height:1}
.lflag.todo{color:var(--orange);font-weight:600}

.cbx{width:15px;height:15px;flex:0 0 15px;border:.5px solid var(--bd2);border-radius:4px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;margin-right:2px}
.cbx:hover{border-color:var(--fg3)}
.cbx.on{background:var(--blue);border-color:var(--blue)}
.nrow.excluded{opacity:.62}
/* 行内标签：未启用（被排除）/ 未编译（未纳入编译但计入） */
.tag-un,.tag-nc{font-size:10px;line-height:1.6;padding:0 5px;border-radius:4px;
  flex:0 0 auto;white-space:nowrap}
.tag-un{background:var(--bg3);color:var(--fg3);border:.5px solid var(--bd2)}
.tag-nc{color:var(--fg3);border:.5px dashed var(--bd2)}
.legend{border-top:.5px solid var(--bd);margin-top:12px;padding-top:10px}
.legend .li{display:flex;align-items:center;gap:8px;font-size:12px;
  color:var(--fg3);padding:2px 0}

/* 搜索与筛选 */
.search{display:flex;align-items:center;gap:7px;background:var(--bg2);
  border:.5px solid var(--bd);border-radius:7px;padding:6px 10px;min-width:210px}
.search input{border:0;background:transparent;color:var(--fg);font-size:13px;
  outline:none;width:100%;font-family:inherit}
.search input::placeholder{color:var(--fg3)}
/* 搜索命中的高亮与计数 */
mark{background:#378add45;color:inherit;border-radius:3px;padding:0 1px}
.hits{font-size:11px;color:var(--fg3);white-space:nowrap}

/* 未启用章 / 未纳入索引的文件 */
#unused,#orphans{margin-top:14px;background:var(--bg2);border-radius:10px;overflow:hidden}
#unused .uh,#orphans .uh{padding:11px 16px;cursor:pointer;display:flex;align-items:center;
  gap:8px;font-size:13px;color:var(--fg2)}
#unused .uh:hover,#orphans .uh:hover{background:var(--bg3)}
#unused .ub,#orphans .ub{padding:0 16px 14px}
#unused table,#orphans table{width:100%;border-collapse:collapse;font-size:12px}
#unused td,#unused th,#orphans td,#orphans th{text-align:left;padding:6px 8px;
  border-bottom:.5px solid var(--bd);color:var(--fg2)}
#unused th,#orphans th{color:var(--fg3);font-weight:400}
#unused .uhint,#orphans .uhint{padding:0 16px 10px;font-size:11px;color:var(--fg3)}
.tbtn{display:inline-block;white-space:nowrap;cursor:pointer;font-size:12px;
  padding:3px 10px;border:.5px solid var(--bd2);border-radius:5px;color:var(--fg2);
  line-height:1.4}
.tbtn:hover{background:var(--bg3);color:var(--fg)}
.tdel{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;
  cursor:pointer;color:var(--fg3);font-size:14px;line-height:1;border-radius:4px}
.tdel:hover{color:var(--fg);background:var(--bg3)}

/* 详情面板 */
.p-title{font-size:14px;font-weight:500;margin-bottom:3px;word-break:break-all}
.p-path{font-size:11px;color:var(--fg3);word-break:break-all;margin-bottom:12px}
.p-line{display:flex;align-items:center;justify-content:space-between;padding:5px 0}
.p-line .k{color:var(--fg2);font-size:12px}
.p-line .v{font-size:12px}
.p-line .v.todo{color:var(--orange)}
.p-sec{border-top:.5px solid var(--bd);margin-top:10px;padding-top:10px}
.p-lab{font-size:12px;color:var(--fg3);margin-bottom:6px}
textarea,input[type=text]{width:100%;background:var(--bg3);border:.5px solid var(--bd);
  border-radius:6px;color:var(--fg);font-family:inherit;font-size:13px;padding:8px;
  resize:vertical;outline:none}
textarea:focus,input[type=text]:focus{border-color:var(--bd2)}
.todo-item{display:flex;align-items:flex-start;gap:8px;padding:4px 0;font-size:12px}
.todo-item .tx{flex:1;word-break:break-word}
.todo-item.done .tx{color:var(--fg3);text-decoration:line-through}
.tbox{width:12px;height:12px;flex:0 0 12px;border:.5px solid var(--gray-mid);border-radius:3px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:2px}
.p-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.p-empty{color:var(--fg3);font-size:12px;padding:20px 0;text-align:center}
.p-warn{display:flex;align-items:flex-start;gap:7px;font-size:12px;color:var(--fg2);
  padding:3px 0}
.p-warn svg{flex:0 0 12px;margin-top:2px}
.hint{color:var(--fg3);font-size:12px}
.empty{color:var(--fg3);font-size:13px;padding:24px;text-align:center}

/* 设置 */
#settingsBox .srow{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px}
#settingsBox .srow .k{flex:0 0 auto;color:var(--fg2)}
#settingsBox .grow{flex:1;min-width:0}
#settingsBox .shint{font-size:11px;color:var(--fg3);line-height:1.8;margin-top:2px}
#settingsBox table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
#settingsBox td,#settingsBox th{text-align:left;padding:7px 8px;
  border-bottom:.5px solid var(--bd);color:var(--fg2);vertical-align:middle}
#settingsBox th{color:var(--fg3);font-weight:400}
#settingsBox select{background:var(--bg3);color:var(--fg);border:.5px solid var(--bd2);
  border-radius:6px;padding:5px 8px;font-family:inherit;font-size:12px;max-width:100%}
#settingsBox .badge{font-size:10px;padding:0 6px;border-radius:4px;background:var(--bg3);
  color:var(--fg3);border:.5px solid var(--bd2);white-space:nowrap;display:inline-block}
#settingsBox .badge.man{color:var(--orange);border-color:var(--orange)}
.tsw{position:relative;width:34px;height:18px;flex:0 0 34px;border-radius:20px;
  background:var(--bg3);border:.5px solid var(--bd2);cursor:pointer}
.tsw i{position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;
  background:var(--fg3);transition:left .15s}
.tsw.on{background:var(--blue);border-color:var(--blue)}
.tsw.on i{left:18px;background:#fff}

/* 搜索结果与预览层 */
.sres .g{font-size:11px;color:var(--fg3);padding:10px 0 4px}
.sres .it{padding:8px 10px;border-radius:7px;cursor:pointer;
  border:.5px solid transparent;margin-bottom:2px}
.sres .it:hover{background:var(--bg3);border-color:var(--bd)}
.sres .it .t{font-size:13px;color:var(--fg)}
.sres .it .sn{font-size:11px;color:var(--fg2);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sres .it .sn b{color:var(--fg3);font-weight:400}
.cnt.bh{color:var(--blue)}
#viewer{position:fixed;inset:0;z-index:80;background:var(--bg);
  display:flex;flex-direction:column}
#viewer .vbar{display:flex;align-items:center;gap:10px;padding:8px 14px;
  border-bottom:.5px solid var(--bd);background:var(--bg2)}
#viewer .vbar .vt{font-size:14px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:34%}
#viewer .vbar .vpath{font-size:11px;color:var(--fg3);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:30%}
#viewer .vbody{flex:1;display:flex;min-height:0}
#viewer .vsrc{flex:1;overflow:auto;padding:10px 0;min-width:0;
  font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:12px}
#viewer .vpdf{flex:1;min-width:0;border-left:.5px solid var(--bd);background:var(--bg2)}
#viewer .vpdf iframe{width:100%;height:100%;border:0;display:block}
#viewer[data-layout="src"] .vpdf{display:none}
#viewer[data-layout="pdf"] .vsrc{display:none}
#viewer .vfoot{padding:6px 14px;border-top:.5px solid var(--bd);font-size:11px;
  color:var(--fg3);display:flex;gap:14px;flex-wrap:wrap}
.srcline{display:flex;gap:12px;padding:0 14px;line-height:1.75;white-space:pre-wrap;
  word-break:break-word}
.srcline .n{flex:0 0 42px;text-align:right;color:var(--fg3);user-select:none}
.srcline.hit{background:#ef9f2722}
.srcline mark{background:#378add40;border-radius:2px}
@media(max-width:900px){
  #viewer .vbody{flex-direction:column}
  #viewer .vpdf{border-left:0;border-top:.5px solid var(--bd)}
}
/* 欠账页 */
.toolbar .sp{flex:1}
.lrow{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px}
.lrow:hover{background:var(--bg3)}
.lsrc{flex:0 0 auto;font-size:11px;line-height:1.7;padding:0 6px;border-radius:4px;
  background:var(--bg3);color:var(--orange);border:.5px solid var(--bd2);white-space:nowrap}
.lsrc.s-plan{color:var(--blue)}
.lmain{flex:1;min-width:0;cursor:pointer}
.lcrumb{display:block;font-size:11px;color:var(--fg3);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.ltext{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lmeta{flex:0 0 auto;font-size:11px;color:var(--fg3);white-space:nowrap}
.lmeta.over{color:var(--orange)}
.ldims{display:flex;gap:7px;flex:0 0 auto;align-items:center}
#ledgerBox .card{padding:6px}
#resume .row.led{border:.5px solid var(--bd);margin-bottom:8px}
#resume .row.led .rnote{color:var(--orange)}
.mark-dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;background:var(--orange)}

/* 统计页 */
.statsUnit{display:flex;align-items:center;gap:10px;padding:5px 0}
.statsUnit .sun{flex:0 0 132px;font-size:12px;color:var(--fg2);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.statsUnit .sbar{flex:1;height:10px}
.statsUnit .snum{flex:0 0 120px;font-size:11px;color:var(--fg3);text-align:right}
.bar span.d-mark{background:var(--orange)}
.bar span.d-todo{background:var(--orange);opacity:.7}
.bar span.d-chapter{background:var(--orange);opacity:.45}
.bar span.d-plan{background:var(--blue)}
.statLeg{display:flex;flex-wrap:wrap;gap:14px;font-size:11px;color:var(--fg3);margin-bottom:10px}
.statLeg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;
  vertical-align:-1px}
.chartCap{font-size:11px;color:var(--fg3);margin-top:8px;line-height:1.7}
.chartWrap{overflow-x:auto;padding-bottom:2px}
.chartInner{position:relative}
.cTip{position:absolute;z-index:5;pointer-events:none;background:var(--bg3);
  border:.5px solid var(--bd2);border-radius:7px;padding:6px 9px;max-width:280px;
  font-size:11px;line-height:1.65;box-shadow:0 2px 10px rgba(0,0,0,.22)}
.cTip .tt{color:var(--fg)}
.cTip .tv{color:var(--fg3)}
.lineGuide{stroke:var(--bd2);stroke-width:1}
.lineLegend{display:flex;flex-wrap:wrap;gap:5px 18px;font-size:11px;color:var(--fg3);
  margin-top:10px;line-height:1.7}
.lineLegend .ll{white-space:nowrap}
.lineLegend .ll i{font-style:normal;color:var(--orange);margin-left:5px}
.donutWrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.envLeg{flex:0 0 auto;min-width:0}
.envLeg .li{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg2);padding:2px 0}
.envLeg .li .cb{display:inline-block;width:10px;height:10px;border-radius:2px;flex:0 0 10px}
.envLeg .li .nm{flex:0 0 auto;min-width:44px}
.envLeg .li .v{margin-left:0;color:var(--fg3);font-size:11px;white-space:nowrap}
.clearBtn{margin-left:8px;font-size:11px;font-weight:400;color:var(--fg3);cursor:pointer;
  padding:1px 7px;border:.5px solid var(--bd2);border-radius:5px}
.clearBtn:hover{background:var(--bg3);color:var(--fg)}
/* 环境构成的明细表：粒度跟随范围，每行可展开下一层 */
.envTblWrap{overflow-x:auto;margin-top:12px}
.envTbl{border-collapse:collapse;font-size:11px;min-width:100%}
.envTbl th,.envTbl td{padding:4px 9px;text-align:right;white-space:nowrap;

/* 未启用块：不计入合计，但列出来，让两套口径的差异看得见 */

.dn0{stroke:var(--blue)}

<!-- 全屏预览层：左边源码片段、右边 PDF（定位到命中页） -->

<script>
"use strict";

/* ============================ 状态层 ============================ */
const S = {
  data: null,
  view: "overview",
  sort: "recent",
  noteIdx: 0,
  filter: "all",
  query: "",
  selected: null,          // 选中的叶子 id
  open: new Set(),         // 展开的目录节点 id
  unusedOpen: false,
  orphansOpen: false,
  showUnused: true,        // 树中是否一并显示未启用的章（灰显）；默认值由服务端设置决定
  editMode: false,         // 编辑范围：显示行尾复选框
  bodySearch: true,        // 搜索是否含正文（默认含；切换后记住）
  search: null,            // 服务端正文检索结果；null = 没有进行正文检索
  panelMode: "auto",       // auto = 有结果就先显示结果列表；detail = 用户点了树，看详情
  viewer: null,            // 预览层当前的目标 {id, note, title, path, page}
  /* 欠账页 */
  ledgerSrc: new Set(["mark", "todo", "plan", "chapter"]),  // 来源筛选（默认全选）
  ledgerNote: "__all__",   // 笔记筛选
  ledgerSort: "stale",     // stale = 最久未动在前；order = 章节顺序
  /* 统计页 */
  statsScope: "__all__",   // "__all__" 或某本笔记的目录名
  statsSeries: "envs",     // 折线图当前显示的序列
  lineGeo: null,           // 折线图的几何与数据，供悬停取用
  envOpen: new Set(),      // 环境构成表里展开到下一层的行
};

const API = {
  data:     (force) => "/api/data" + (force ? "?refresh=1" : ""),
  entry:    "/api/entry",
  chapter:  "/api/chapter",
  open:     "/api/open",
  quit:     "/api/quit",
  report:   "/api/report",
  settings: "/api/settings",
  marksExport: "/api/marks/export",
  marksImport: "/api/marks/import",
  search:   "/api/search",
  source:   "/api/source",
  pdfPage:  "/api/pdfpage",
  pdf:      (note) => "/api/pdf?note=" + encodeURIComponent(note),
};

/* ============================ 数据层 ============================ */
async function fetchData(force) {
  const r = await fetch(API.data(force));
  if (!r.ok) throw new Error("数据请求失败");
  return await r.json();
}

async function postJSON(url, body) {
  const r = await fetch(url, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body || {}),
  });
  if (!r.ok) throw new Error("请求失败");
  const d = await r.json();
  /* 服务端写盘失败时会带 saved:false（文件被杀软 / 索引器占用）——
     改动还在内存里，但没落盘，得让用户知道并重试一次。 */
  if (d && d.saved === false) toast("改动没写进磁盘（文件被占用），请再试一次");
  return d;
}

async function loadAndRender(force) {
  setSvc(true);
  try {
    const d = await fetchData(force);
    S.data = d;
    if (S.noteIdx >= d.notes.length) S.noteIdx = 0;
    applySettings();
    ensureDefaultOpen();
    refreshAll();
    /* 刷新（重扫）后正文也可能变了，查过的词重查一遍 */
    if (S.bodySearch && S.query) scheduleBodySearch();
  } catch (e) {
    setSvc(false, "服务已停止");
  }
}

/* 服务端设置 → 界面状态（设置是跨浏览器持久化的，不用 localStorage） */
function applySettings() {
  const st = (S.data && S.data.settings) || {};
  S.showUnused = st.show_unused !== false;
  const btn = document.getElementById("btnUnusedToggle");
  if (btn) btn.classList.toggle("on", S.showUnused);
}

/* 默认展开当前笔记中最近改动的那一章 */
function ensureDefaultOpen() {
  if (S.open.size) return;
  const n = currentNote();
  if (!n) return;
  const cand = (n.tops || []).filter((t) => t.decision);
  if (!cand.length) return;
  let pick = cand[0];
  cand.forEach((t) => {
    if ((t.last_mtime || 0) > (pick.last_mtime || 0)) pick = t;
  });
  S.open.add(pick.id);
}

/* ============================ 计算层 ============================ */
function currentNote() {
  if (!S.data || !S.data.notes.length) return null;
  return S.data.notes[S.noteIdx];
}

function walkLeaves(node, acc) {
  acc = acc || [];
  if (node.type === "leaf") { acc.push(node); }
  else { (node.children || []).forEach((c) => walkLeaves(c, acc)); }
  return acc;
}

function noteLeaves(note) {
  const acc = [];
  (note.tops || []).forEach((t) => { if (t.decision) walkLeaves(t, acc); });
  return acc;
}

/* 小节的内容三态：**只看文件本身**。
   「待补」是另一个维度（按三维标记），不参与这里 —— 否则一个已写小节只要标了
   任一维待补，树上的蓝点就会变成「未建」的深灰空心点，还会从「已写」筛选里消失。 */
function leafState(leaf) {
  if (leaf.status === "missing") return "missing";
  if (leaf.status === "empty") return "empty";
  return "written";
}

function matchFilter(leaf) {
  /* 「待补」按标记判，与服务端的 pending 口径一致（不看内容三态） */
  if (S.filter === "todo") return (leaf.todo_count || 0) > 0;
  const st = leafState(leaf);
  if (S.filter === "all") return true;
  if (S.filter === "written") return st === "written";
  if (S.filter === "empty") return st === "empty";
  if (S.filter === "missing") return st === "missing";
  if (S.filter === "hint") return !!leaf.hint_level;
  return true;
}

/* 查询词：按空白切分，**全部命中**才算匹配（AND）。
   例：「张量积 模」= 标题里同时含这两个词的小节（如「两个模的张量积」）。 */
function queryTermsOf(q) {
  const s = String(q == null ? "" : q).trim();
  return s ? s.toLowerCase().split(/\s+/).filter((x) => x.length > 0) : [];
}

function queryTerms() { return queryTermsOf(S.query); }

/* 匹配显示名与（去掉编号前缀、下划线已转空格的）文件名 */
function matchTerms(node, terms) {
  if (!terms.length) return true;
  const hay = ((node.view_title || "") + " " + (node.name || "")).toLowerCase();
  return terms.every((t) => hay.indexOf(t) >= 0);
}

function matchQuery(node) { return matchTerms(node, queryTerms()); }

/* 正文命中的小节：来自服务端检索结果（按 id 索引） */
function bodyHit(id) {
  return (S.search && S.search.byId && S.search.byId[id]) || null;
}

function leafVisible(leaf) {
  return matchFilter(leaf) && (matchQuery(leaf) || !!bodyHit(leaf.id));
}

/* 过滤后仍有可见后代的分支才显示 */
function nodeHasVisible(node) {
  if (node.type === "leaf") return leafVisible(node);
  const kids = node.children || [];
  if (!kids.length) {
    /* 内容写在自身 index.tex 里、没有下级文件的目录：以自身为准参与筛选 */
    if (!matchQuery(node) && !bodyHit(node.id)) return false;
    if (S.filter === "all") return true;
    const st = (node.stats && node.stats.written > 0) ? "written" : "empty";
    if (S.filter === "written") return st === "written";
    if (S.filter === "empty") return st === "empty";
    return false;
  }
  if (kids.some(nodeHasVisible)) return true;
  /* 分支自身的标题命中、而子项都没命中时，也把它列出来（折叠着，展开即看全）
     —— 这样按「节」这一级检索也能找到 */
  return queryTerms().length > 0 && matchQuery(node);
}

function sortedNotes() {
  const ns = (S.data.notes || []).slice();
  if (S.sort === "name") {
    ns.sort((a, b) => a.title.localeCompare(b.title, "zh-Hans-CN"));
  } else {
    ns.sort((a, b) => (b.last_mtime || 0) - (a.last_mtime || 0));
  }
  return ns;
}

function sortedForDisplay() {
  /* 明细页的笔记选择始终按名称，避免索引跳动 */
  return (S.data.notes || []).slice();
}

/* ============================ 工具 ============================ */
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

/* 高亮命中词：**在原文本上定位命中，再逐段转义**。长词优先，免得短词先吃掉长词的一部分。
   不能先整段 esc 再替换 —— 那样 <mark> 会被插进 `&lt;` / `&amp;` 这类实体内部，
   页面就会把实体名当字面文本显示出来（搜 "a" 之类会大面积触发）。 */
function hiText(text, terms) {
  const s = String(text == null ? "" : text);
  const pats = (terms || [])
    .map((t) => String(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"))
    .filter((t) => t.length)
    .sort((a, b) => b.length - a.length);
  if (!pats.length) return esc(s);
  let re = null;
  try {
    re = new RegExp(pats.join("|"), "gi");
  } catch (err) {
    return esc(s);
  }
  let out = "", last = 0, m;
  re.lastIndex = 0;
  while ((m = re.exec(s)) !== null) {
    if (m.index > last) out += esc(s.slice(last, m.index));
    out += "<mark>" + esc(m[0]) + "</mark>";
    last = m.index + m[0].length;
    if (m[0] === "") re.lastIndex++;      // 零宽匹配保护
  }
  return out + esc(s.slice(last));
}

function fmtInt(n) { return (n || 0).toLocaleString("zh-CN"); }

function fmtBig(n) {
  n = n || 0;
  if (n >= 100000000) return (n / 100000000).toFixed(2) + " 亿";
  if (n >= 10000) return (n / 10000).toFixed(1) + " 万";
  return fmtInt(n);
}

function barHTML(c) {
  const total = Math.max(c.planned || 0, 1);
  const w = (c.written || 0) / total * 100;
  const e = (c.empty || 0) / total * 100;
  const m = (c.missing || 0) / total * 100;
  return '<div class="bar">'
    + '<span class="sw" style="width:' + w + '%"></span>'
    + '<span class="se" style="width:' + e + '%"></span>'
    + '<span class="sm" style="width:' + m + '%"></span>'
    + '</div>';
}

/* 图标一律走主题变量（style 里才认 var()，SVG 属性不认）——
   硬编码的 #8b8982 / #ef9f27 在亮色主题下对比度偏低。 */
const SVG_CHECK = '<svg class="ico" viewBox="0 0 16 16" fill="none" style="stroke:var(--fg3)" '
  + 'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'
  + '<path d="M3.2 8.4L6.4 11.6L12.8 4.6"/></svg>';
const SVG_CIRCLE = '<svg class="ico" viewBox="0 0 16 16" fill="none" style="stroke:var(--orange)" '

const RECENT_CUT_KEY = "wb_progress_recent_cut";

function recentCutMs() {
  try { return parseInt(localStorage.getItem(RECENT_CUT_KEY) || "0", 10) || 0; }

function renderResume() {
  const d = S.data;
  const box = document.getElementById("resume");
  if (!d) { box.innerHTML = ""; return; }
  let h = '<div class="card"><p class="sec-h">续写入口</p>';

  /* 欠账的聚合入口：本页只做速览，精细清单在「欠账」页。
     徽标数与欠账页的「共 N 条」由同一个 collectPending() 算出，免得两处不等。 */
  const pendAll = collectPending(d).length;
  h += '<div class="row led" data-goto-ledger="1">'
    + '<span class="mark-dot"></span>'
    + '<span class="rname">欠账清单</span>'
    + '<span class="rnote">共 ' + pendAll + ' 条 →</span></div>';

  const nexts = [];
  (d.notes || []).forEach((n) => (n.planned_next || []).forEach((p) => nexts.push(p)));
  nexts.slice(0, 2).forEach((p) => {
    h += '<div class="row" data-open-path="' + esc(p.path) + '">'
      + '<span class="dot w"></span>'
      + '<span class="rname">' + esc(p.title) + '</span>'
      + '<span class="rnote">已设为下一步</span></div>';
  });

  /* 最近改动：按 mtime 排，但「打开过」或「只被顺手改过一下」的文件也会进来，
     所以给一个「清除」，把这一批当作已看过。 */
  const cut = recentCutMs();
  const recent = (d.recent || []).filter((r) => (r.mtime || 0) * 1000 > cut);
  if (recent.length) {
    h += '<p class="sec-h" style="margin-top:' + (nexts.length ? '10px' : '0')
      + '">最近改动<span class="clearBtn" data-clear-recent="1" title="把这一批改动'

function miniBar(stats) {
  const total = Math.max((stats && stats.planned) || 0, 1);
  const w = ((stats && stats.written) || 0) / total * 100;
  const e = ((stats && stats.empty) || 0) / total * 100;
  const m = ((stats && stats.missing) || 0) / total * 100;
  return '<span class="mini bar">'
    + '<span class="sw" style="width:' + w + '%"></span>'
    + '<span class="se" style="width:' + e + '%"></span>'
    + '<span class="sm" style="width:' + m + '%"></span></span>';
}

/* 小节：三个维度（环境 / 正文 / 证明）的完成情况，蓝为已完成、橙为待补 */
function dimBar(marks) {
  const m = marks || {};
  let h = '<span class="mini bar">';
  ["env", "body", "proof"].forEach((d) => {
    h += '<span class="' + (m[d] === "todo" ? "st" : "sw")
      + '" style="width:33.33%"></span>';
  });
  return h + '</span>';
}

function nodeRowHTML(node, depth, searching) {
  const isDir = node.type !== "leaf" && node.type !== "missing";
  const terms = queryTerms();
  /* 搜索时：沿途只要有命中的后代就自动展开，命中项一眼可见 */
  const hitBelow = searching && (node.children || []).some(nodeHasVisible);
  const isOpen = S.open.has(node.id) || hitBelow;
  const sel = S.selected === node.id ? " sel" : "";
  const raw = node.view_title || node.name;
  const label = (node.num ? node.num + " " : "") + hiText(raw, terms);
  const ex = !!node.excluded;
  /* 复选框只在「编辑范围」模式下出现，且置于行尾，避免干扰日常浏览 */
  const cbx = S.editMode
    ? '<span class="cbx' + (ex ? "" : " on") + '" data-toggle-node="' + esc(node.id)
      + '" title="' + (ex ? "已排除，点击计入" : "计入中，点击排除") + '">'
      + (ex ? "" : SVG_TICK) + '</span>'
    : '';

  let marksHTML = "";
  let dotHTML = "";
  let cnt = "";
  let mini = "";
  let cmk = "";
  let lflag = "";

  if (isDir) {
    const st = node.stats || {};
    mini = miniBar(st);
    cnt = '<span class="cnt">' + (node.children || []).length + ' 项</span>'
      + '<span class="cnt mono">' + (st.written || 0) + "/" + (st.planned || 0) + '</span>';
    /* 章级标记：与小节级待补汇总并存，语义不同（不好归到某一节的问题） */
    const cm = !!node.chapter_mark;
    cmk = '<span class="cmk' + (cm ? " on" : "") + '" data-chmark="' + esc(node.id)
      + '" title="' + (cm ? "整章待补（点击取消）" : "整章待补（点击标记）") + '">'
      + (cm ? SVG_CIRCLE : SVG_FLAG) + '</span>';
  } else if (node.type === "missing") {
    dotHTML = '<span class="dot m"></span>';
    cnt = '<span class="cnt">未建</span>';
  } else {
    const st = leafState(node);
    dotHTML = '<span class="dot ' + (st === "written" ? "w" : st === "empty" ? "e" : "m")
      + '"></span>';
    const mk = node.marks || {};
    mini = dimBar(mk);
    marksHTML = '<span class="marks">'
      + ['env', 'body', 'proof'].map((d) => {
          const todo = mk[d] === "todo";
          return '<span class="mk" data-mark="' + d + '" data-id="' + esc(node.id)
            + '" title="' + (d === "env" ? "环境" : d === "body" ? "正文" : "证明")
            + (todo ? "：待补" : "：已完成") + '">'
            + (todo ? SVG_CIRCLE : SVG_CHECK) + '</span>';
        }).join("")
      + '</span>';
    if (node.todo_count) {
      cnt = '<span class="cnt" style="color:var(--orange)">' + node.todo_count + ' 待补</span>';
    }
    /* 提示（红＝硬问题、琥珀＝软提示），悬停显示原因 */
    if (node.hint_level) {
      cnt += '<span class="pdot ' + node.hint_level + '" title="'
        + esc((node.hints || []).map((x) => x.text).join("；")) + '"></span>';
    }
    /* 正文命中的小节：行尾标出命中处数，点行即看源码 / PDF */
    const bh = bodyHit(node.id);
    if (bh) {
      cnt += '<span class="cnt bh" title="正文里有 ' + bh.count
        + ' 处命中（点开详情面板看片段）">正文 ' + bh.count + '</span>';
    }
    /* 备注 / 待办的行内小标记 */
    const openTodos = (node.todos || []).filter((t) => !t.done).length;
    if (node.note) {
      lflag += '<span class="lflag" title="有备注">' + SVG_NOTE + '</span>';
    }
    if (openTodos) {
      lflag += '<span class="lflag todo" title="' + openTodos + ' 条未完成待办">'
        + openTodos + '</span>';
    }
  }

  /* 行内标签：未启用 = 被排除、不计入统计；未编译 = 索引里被注释掉、但仍计入 */
  let tag = "";
  if (ex) tag = '<span class="tag-un">未启用</span>';
  else if (node.included === false) tag = '<span class="tag-nc">未编译</span>';

  let h = '<div class="nrow' + (isDir ? " lv" + Math.min(depth, 3) : "")
    + (isOpen ? " open" : "") + sel + (ex ? " excluded" : "")
    + '" data-node="' + esc(node.id)
    + '" data-kind="' + node.type + '">'
    + (isDir ? SVG_CARET : '<span class="caret leaf"></span>')
    + dotHTML + '<span class="nm">' + label + '</span>' + tag
    + mini + cnt + cmk + marksHTML + lflag + cbx + '</div>';

  if (isDir && isOpen) {
    h += '<div class="kids">';
    (node.children || []).forEach((c) => {
      if (nodeHasVisible(c)) h += nodeRowHTML(c, depth + 1, searching);
    });
    h += '</div>';
  }
  return h;
}

function renderTree() {
  const box = document.getElementById("tree");
  const n = currentNote();
  if (!n) { box.innerHTML = '<div class="empty">请先选择笔记</div>'; return; }
  const searching = queryTerms().length > 0;
  if (!searching && lastQuery) keepSearchOpen();
  lastQuery = S.query;
  let h = "";
  (n.tops || []).forEach((t) => {
    /* 未启用的章默认也进树（灰显 + 「未启用」标签）——否则它下面的节 / 小节
       在页面上完全看不到，用户会以为工作台「没显示全」。可用工具栏按钮关掉。 */
    if (!t.decision && !S.showUnused) return;
    if (nodeHasVisible(t)) h += nodeRowHTML(t, 0, searching);
  });
  box.innerHTML = h || '<div class="empty">没有符合条件的条目</div>';
  updateHits(n, searching);
}

/* 搜索命中的计数与「清空后保留展开」 */

let lastQuery = "";   /* 上一次的查询词，用于清空搜索时把命中的目录留在展开状态 */

function keepSearchOpen() {
  const terms = queryTermsOf(lastQuery);
  if (!terms.length) return;
  const n = currentNote();
  if (!n) return;
  /* 与渲染时的自动展开同一口径：子树里存在命中的小节 */
  const hit = (node) => {
    if (node.type === "leaf") {
      /* 与渲染时的 nodeHasVisible 同口径：标题命中或**正文命中**都算 */
      return matchFilter(node) && (matchTerms(node, terms) || !!bodyHit(node.id));
    }
    return (node.children || []).some(hit);
  };
  const dig = (node) => {
    if (node.type === "leaf" || !hit(node)) return;
    S.open.add(node.id);
    (node.children || []).forEach(dig);
  };
  (n.tops || []).forEach(dig);
}

function updateHits(note, searching) {
  const el = document.getElementById("hits");
  if (!el) return;
  if (!searching && !S.search) { el.textContent = ""; return; }
  let c = 0, b = 0;
  const terms = queryTerms();
  if (note) {
    (note.tops || []).forEach((t) => {
      if (!t.decision && !S.showUnused) return;
      walkLeaves(t).forEach((l) => {
        if (leafVisible(l)) { c++; if (bodyHit(l.id)) b++; }
      });
      /* 只有目录（章 / 节）标题命中、其下没有可见小节时也要计入 ——
         否则会出现「树上明明有一行被高亮，右上角却写无匹配」。 */
      const digDir = (node) => {
        if (node.type === "leaf" || node.type === "missing") return 0;
        let n = 0;
        const hasVisible = walkLeaves(node).some(leafVisible);
        if (!hasVisible && terms.length && matchQuery(node)) n = 1;
        (node.children || []).forEach((k) => { n += digDir(k); });
        return n;
      };
      c += digDir(t);
    });
  }
  const total = (S.search && S.search.total) || 0;
  if (c) {
    el.textContent = "命中 " + c + " 节" + (b ? "（含正文 " + b + "）" : "");
  } else if (total) {
    el.textContent = "本笔记无命中（全库 " + total + " 节）";
  } else {
    el.textContent = "无匹配";
  }
}

  /* 正文检索有结果时，面板优先显示结果列表（点了树上的节点就切回详情） */
  if (S.search && (S.search.results || []).length && S.panelMode === "auto") {
    box.innerHTML = panelResultsHTML() + legendHTML();
    return;
  }
  if (!n || !S.selected) {
    box.innerHTML = '<div class="p-empty">点击左侧任一章节或小节查看详情</div>'
      + legendHTML();
    return;
  }
  const node = findNode(S.selected);
  if (!node) {
    box.innerHTML = '<div class="p-empty">该条目已不在当前范围内</div>';
    return;
  }
  /* 目录节点（章 / 节）也能选中：面板给出整章待补、批量标记与计入范围 */
  const body = (node.type === "leaf" || node.type === "missing")
    ? panelLeafHTML(node) : panelDirHTML(node);
  box.innerHTML = body + legendHTML();
}

/* 正文检索结果列表：按笔记分组，点条目打开源码 / PDF 预览层 */
function panelResultsHTML() {
  const r = S.search;
  const groups = [];
  const seen = {};
  (r.results || []).forEach((x) => {
    if (!seen[x.note]) { seen[x.note] = groups.length; groups.push([x.note, []]); }
    groups[seen[x.note]][1].push(x);
  });
  let h = '<div class="p-title">正文命中</div>'
    + '<div class="p-path">关键词 ' + r.terms.map(esc).join(" + ")
    + ' · 命中 ' + r.total + ' 个小节 · 跨 ' + groups.length + ' 本笔记</div>'
    + '<div class="p-btns"><button class="pri" id="btnFirstHit">'
    + '打开第一条命中（源码 + PDF）</button></div>';
  groups.forEach(([note, rows]) => {
    h += '<div class="sres"><div class="g">' + esc(noteTitle(note))
      + '（' + rows.length + ' 节）</div>';
    rows.forEach((x) => {
      h += '<div class="it" data-hit-id="' + esc(x.id) + '" data-hit-note="'
        + esc(x.note) + '" data-hit-title="' + esc(x.title) + '">'
        + '<div class="t">' + esc((x.num ? x.num + " " : "") + x.title)
        + ' <span class="cnt">' + x.count + ' 处</span></div>'
        + (x.hits || []).slice(0, 2).map((hh) =>
            '<div class="sn"><b>L' + hh.line + '</b> '
            + hiText(hh.text, r.terms) + '</div>').join("")
        + '</div>';
    });
    h += '</div>';
  });
  return h;
}

function noteTitle(name) {
  const n = (S.data.notes || []).find((x) => x.name === name);
  return n ? n.title : name;
}

function findLeafAnywhere(id) {
  const res = {node: null, note: null};
  (S.data.notes || []).forEach((n) => {
    const dig = (x) => {
      if (res.node) return;
      if (x.id === id && x.type === "leaf") { res.node = x; res.note = n; return; }
      (x.children || []).forEach(dig);
    };
    (n.tops || []).forEach(dig);
  });
  return res;
}

/* ============================ 预览层：源码 + PDF ============================ */

let viewerSeq = 0;      // 连续点开不同条目时，用来丢弃过期的响应

async function openViewer(id, noteName, title) {
  const leaf = findLeafAnywhere(id).node;
  const terms = (S.search && S.search.terms) || queryTerms();
  S.viewer = {
    id: id,
    note: noteName,
    title: title || (leaf && (leaf.view_title || leaf.name)) || id,
    path: (leaf && leaf.path) || "",
    page: 0,
  };
  const seq = ++viewerSeq;
  document.getElementById("vTitle").textContent = S.viewer.title;
  document.getElementById("vPath").textContent = noteName + " / " + id;
  document.getElementById("vSrc").innerHTML =
    '<div class="srcline"><span class="n"></span><span>正在读取源码…</span></div>';
  document.getElementById("vFoot").textContent = "正在定位 PDF 页码…";
  document.getElementById("vPdf").src = "about:blank";
  document.getElementById("viewer").hidden = false;

  /* 源码与 PDF 并行取：PDF 首次要抽页文本（几秒），不必等源码读完再开始 */
  const q = terms.join(" ");
  const wantSrc = postJSON(API.source, {id: id, q: q}).then((s) => {
    if (seq === viewerSeq) {
      document.getElementById("vSrc").innerHTML = sourceHTML(s, terms);
    }
  }).catch(() => {
    if (seq === viewerSeq) {
      document.getElementById("vSrc").innerHTML =
        '<div class="srcline"><span class="n"></span><span>源码读取失败</span></div>';
    }
  });

  const wantPdf = postJSON(API.pdfPage, {note: noteName, q: q}).then((p) => {
    if (seq !== viewerSeq) return;
    const page = p.first || 0;
    S.viewer.page = page;
    let foot = "";
    if (p.message) foot += '<span>' + esc(p.message) + '</span>';
    else if (p.matched) {
      /* pages 是截断到 40 条的清单，真实命中页数看 pages_total */
      const np = (p.pages_total != null) ? p.pages_total : (p.pages || []).length;
      foot += '<span>PDF 里 ' + np + ' 页含这些词（共 '
        + p.total + ' 页）</span>';
    } else foot += '<span>PDF 文本里没找到这些词</span>';
    if (page) foot += '<span>已定位到第 ' + page + ' 页</span>';
    if (p.pdf_mtime) foot += '<span>PDF 编译于 ' + esc(p.pdf_mtime) + '</span>';
    foot += '<span>PDF 里可用 Ctrl+F 精确定位；源码与 PDF 可能不同步，以源码为准</span>';
    document.getElementById("vFoot").innerHTML = foot;
    document.getElementById("vPdf").src =
      API.pdf(noteName) + (page ? ("#page=" + page) : "");
  }).catch(() => {
    if (seq === viewerSeq) {
      document.getElementById("vFoot").textContent =
        "PDF 定位失败（pdf 或 pdftotext 不可用）";
    }
  });

  await Promise.all([wantSrc, wantPdf]);
}

function sourceHTML(s, terms) {
  if (!s || !s.blocks || !s.blocks.length) {
    return '<div class="srcline"><span class="n"></span>'
      + '<span>没有取到命中行附近的源码</span></div>';
  }
  let h = "";
  s.blocks.forEach((b) => {
    h += '<div class="srcblock">';
    b.lines.forEach((ln) => {
      const hit = b.hits.indexOf(ln.n) >= 0;
      h += '<div class="srcline' + (hit ? " hit" : "") + '">'
        + '<span class="n">' + ln.n + '</span>'
        + '<span class="tx">' + (hit ? hiText(ln.text, terms) : esc(ln.text))
        + '</span></div>';
    });
    h += '</div>';
  });
  h += '<div class="srcline"><span class="n"></span><span>（共 ' + s.total_lines
    + ' 行，显示命中处附近的 ' + s.blocks.length + ' 段）</span></div>';
  return h;
}

function closeViewer() {
  viewerSeq++;          // 让在途的源码 / PDF 响应作废，免得旧结果回写到已经关掉的层上
  document.getElementById("viewer").hidden = true;
  document.getElementById("vPdf").src = "about:blank";
  S.viewer = null;
}

document.getElementById("vClose").addEventListener("click", closeViewer);

document.getElementById("vOpen").addEventListener("click", () => {
  if (S.viewer && S.viewer.path) openFile(S.viewer.path);
});

document.getElementById("vTab").addEventListener("click", () => {
  if (!S.viewer) return;
  window.open(API.pdf(S.viewer.note)
    + (S.viewer.page ? ("#page=" + S.viewer.page) : ""), "_blank");
});

document.getElementById("vLayout").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  document.getElementById("viewer").dataset.layout = b.dataset.vl;
  document.querySelectorAll("#vLayout button").forEach((x) => {
    x.classList.toggle("on", x === b);
  });
});

function panelLeafHTML(leaf) {
  if (leaf.type === "missing") {
    return '<div class="p-title">' + esc(leaf.view_title || leaf.name) + '</div>'
      + '<div class="p-path mono">' + esc(leaf.id) + '</div>'
      + '<div class="p-sec"><div class="p-warn">' + SVG_CIRCLE
      + '<span>索引里已规划，但文件尚未创建</span></div></div>';
  }
  const mk = leaf.marks || {};
  const dims = [["env", "环境"], ["body", "正文"], ["proof", "证明"]];
  const leafRaw = leaf.view_title || leaf.name;
  const leafLabel = leaf.num ? (leaf.num + " " + leafRaw) : leafRaw;
  let h = '<div class="p-title">' + esc(leafLabel) + '</div>'
    + '<div class="p-path mono">' + esc(leaf.id) + '</div>';

  dims.forEach(([k, label]) => {
    const todo = mk[k] === "todo";
    h += '<div class="p-line"><span class="k">' + label + '</span>'
      + '<span class="v' + (todo ? " todo" : "") + '">'
      + (todo ? "待补" : "已完成") + '</span></div>';
  });

  h += '<div class="p-sec">'
    + '<div class="p-line"><span class="k">定理环境</span><span class="v mono">'
      + (leaf.envs || 0) + ' 个</span></div>'
    + '<div class="p-line"><span class="k">环境内字符</span><span class="v mono">'
      + fmtInt(leaf.inner_chars) + '</span></div>'
    + '<div class="p-line"><span class="k">陈述文字</span><span class="v mono">'
      + fmtInt(leaf.body_chars) + '</span></div>'
    + '<div class="p-line"><span class="k">行数</span><span class="v mono">'
      + fmtInt(leaf.lines) + '</span></div>'
    + '<div class="p-line"><span class="k">最后修改</span><span class="v mono">'
      + esc(leaf.mtime_str || "—") + '</span></div>'
    + '</div>';

  /* 环境构成：只列出实际出现过的环境，按数量降序 */
  const ek = leaf.env_names || {};
  const ent = Object.keys(ek).sort((a, b) => ek[b] - ek[a]);
  if (ent.length) {
    h += '<div class="p-sec"><div class="p-lab">环境构成</div>';
    ent.forEach((k) => {
      h += '<div class="p-line"><span class="k">' + esc(ENV_CN[k] || k)
        + '</span><span class="v mono">' + ek[k] + ' 个</span></div>';
    });
    h += '</div>';
  }

  /* 提示由服务端算：硬提示看单文件即可确定，软提示只与同节其他小节横向比较 */
  const hints = leaf.hints || [];
  if (hints.length) {
    h += '<div class="p-sec"><div class="p-lab">值得留意</div>';
    hints.forEach((x) => {
      h += '<div class="p-warn">' + SVG_CIRCLE + '<span>' + esc(x.text) + '</span></div>';
    });
    h += '</div>';
  }

  h += '<div class="p-sec"><div class="p-lab">备注</div>'
    + '<textarea id="noteBox" rows="3" placeholder="写点什么…">'
    + esc(leaf.note || "") + '</textarea></div>';

  h += '<div class="p-sec"><div class="p-lab">待办</div><div id="todoList">';
  (leaf.todos || []).forEach((t, i) => {
    h += '<div class="todo-item' + (t.done ? " done" : "") + '">'
      + '<span class="tbox" data-todo-toggle="' + i + '">'
      + (t.done ? SVG_CHECK : "") + '</span>'
      + '<span class="tx">' + esc(t.text) + '</span>'
      + '<span class="tdel" data-todo-del="' + i + '" title="删除">×</span></div>';
  });
  h += '</div><input type="text" id="todoNew" placeholder="回车添加待办…"></div>';

  h += '<div class="p-btns">'
    + '<button class="pri" id="btnOpen">用 TeXStudio 打开</button>'
    + '<button id="btnPlan">' + (leaf.planned ? "取消下一步" : "设为下一步") + '</button>'
    + '</div>';

  return h;
}

/* 目录节点（章 / 节）的详情：整章待补、批量标记、计入范围 */
function panelDirHTML(node) {
  const st = node.stats || {};
  const raw = node.view_title || node.name;
  const label = node.num ? (node.num + " " + raw) : raw;
  const leaves = walkLeaves(node);
  /* 只算**计入范围内**的小节 —— 与服务端 counted 的口径一致，
     否则会把未启用章下的小节也列进「待标待补」的候选里。 */
  const noProof = leaves.filter((l) => !l.excluded && l.status === "written"
    && !l.has_proof && !l.has_sketch
    && (l.marks || {}).proof !== "todo");
  const cm = !!node.chapter_mark;

  let h = '<div class="p-title">' + esc(label) + '</div>'
    + '<div class="p-path mono">' + esc(node.id) + '</div>';

  if (node.excluded) {
    h += '<div class="p-warn">' + SVG_CIRCLE + '<span>未启用（'
      + esc(REASON_CN[node.excluded_reason] || node.excluded_reason || "已排除")
      + (node.manual ? "，手动设置" : "")
      + '）—— 不计入进度统计，其下小节仍可展开标记</span></div>';
  } else if (node.included === false) {
    h += '<div class="p-warn">' + SVG_CIRCLE
      + '<span>未纳入编译，但已计入统计</span></div>';
  }

  h += '<div class="p-sec">'
    + '<div class="p-line"><span class="k">小节数</span><span class="v mono">'
      + (st.leaves || 0) + '</span></div>'
    + '<div class="p-line"><span class="k">已写 / 规划</span><span class="v mono">'
      + (st.written || 0) + ' / ' + (st.planned || 0) + '</span></div>'
    + '<div class="p-line"><span class="k">定理环境</span><span class="v mono">'
      + fmtInt(st.envs) + ' 个</span></div>'
    + '<div class="p-line"><span class="k">字数</span><span class="v mono">'
      + fmtBig(st.chars) + '</span></div>'
    + '<div class="p-line"><span class="k">最后修改</span><span class="v mono">'
      + esc(node.mtime_str || "—") + '</span></div>'
    + '</div>';

  h += '<div class="p-sec"><div class="p-lab">整章待补</div>'
    + '<div class="shint">用于不好归到某一节的问题 —— 与小节级的待补汇总并存，'
    + '两者语义不同。</div>'
    + '<div class="p-btns"><button id="btnChapterMark"' + (cm ? ' class="pri"' : '')
    + '>' + (cm ? "取消整章待补" : "标为整章待补") + '</button></div></div>';

  if (noProof.length) {
    h += '<div class="p-sec"><div class="p-lab">批量标记</div>'
      + '<div class="shint">本' + esc(nodeLevelWord(node)) + '下已写、但既没有 proof 也没有 '
      + 'sketch 的小节共 ' + noProof.length + ' 个。</div>'
      + '<div class="p-btns"><button id="btnProofAll">'
      + '把它们的「证明」标为待补</button></div></div>';
  }

  h += '<div class="p-sec"><div class="p-lab">计入范围</div>'
    + '<div class="p-btns">'
    + '<button data-chmode="auto" data-id="' + esc(node.id) + '">自动判定</button>'
    + '<button data-chmode="force_include" data-id="' + esc(node.id) + '">强制计入</button>'
    + '<button data-chmode="force_exclude" data-id="' + esc(node.id) + '">强制排除</button>'
    + '</div></div>';

  return h;
}

function noteTopName() {
  const n = currentNote();
  return (n && n.top_name) || "章";
}

/* 某个节点在它那一层叫什么（章 / 节 / 小节）—— 由笔记的层级模式 + 节点编号层数推。
   详情面板的文案不能一律说「本章下」：在「节」的详情里那是错的。推不出来时退回
   「层」，「本层下」不会说错。 */
const LEVEL_WORD = {part: "部分", chapter: "章", section: "节", subsection: "小节"};

function nodeLevelWord(node) {
  const n = currentNote();
  const lv = String((n && n.level_mode) || "").split(",").filter((x) => x && x !== "-");
  const depth = (node && node.num) ? node.num.split(".").length - 1 : 0;
  return LEVEL_WORD[lv[depth]] || "层";
}

function renderUnused() {
  const box = document.getElementById("unused");
  const n = currentNote();
  if (!n) { box.innerHTML = ""; return; }
  const rows = (n.tops || []).filter((t) => !t.decision);
  if (!rows.length) { box.innerHTML = ""; return; }
  const top = n.top_name || "章";

  const reasonText = {
    empty_uncompiled: "未纳入编译且无内容",
    manual_exclude: "手动排除",
  };
  let h = '<div class="uh" id="unusedHead">'
    + '<span>' + (S.unusedOpen ? "▾" : "▸") + '</span>'
    + '<span>未启用' + esc(top) + '（' + rows.length + '）</span></div>';
  if (S.unusedOpen) {
    h += '<div class="uhint">这些条目不计入进度统计，但已在上方的树里灰显列出 —— '
      + '展开即可看到它们下面的全部小节，照常可以标记、备注、打开文件。'
      + '点「计入」把整个' + esc(top) + '纳入统计。</div>';
    h += '<div class="ub"><table><thead><tr><th>' + esc(top) + '</th><th>小节数</th>'
      + '<th>原因</th><th>操作</th></tr></thead><tbody>';
    rows.forEach((t) => {
      h += '<tr><td>' + esc(t.view_title || t.name) + '</td>'
        + '<td class="mono">' + (t.stats ? t.stats.leaves : 0) + '</td>'
        + '<td>' + esc(reasonText[t.decision_reason] || t.decision_reason || "")
        + (t.manual ? ' · <span style="color:var(--orange)">手动</span>' : '')
        + '</td>'
        + '<td><span class="tbtn" data-chmode="force_include" data-id="' + esc(t.id)
        + '" title="把这一章计入进度统计">计入</span></td></tr>';
    });
    h += '</tbody></table></div>';
  }
  box.innerHTML = h;
}

/* 索引里既没引用、也没注释掉的游离 tex：不属于笔记结构，但得让用户看得见 */

/* ============================ 设置页 ============================ */
function renderSettings() {
  const box = document.getElementById("settingsBox");
  if (!S.data) { box.innerHTML = ""; return; }
  const st = S.data.settings || {};
  const modes = S.data.level_modes || [];
  const notes = S.data.notes || [];

  let h = '<div class="card"><p class="sec-h">显示</p>'
    + '<div class="srow"><span class="tsw' + (st.show_unused !== false ? " on" : "")
    + '" id="swUnused"><i></i></span>'
    + '<span class="k">明细页默认显示未启用的章</span></div>'
    + '<div class="shint">开：树上把「未启用」的顶层节点一并列出（灰显、不计入统计），'
    + '其下的小节照常可展开、可标记、可打开文件。<br>'
    + '关：树里只显示计入范围内的条目（仍可在明细页底部把整章计入）。</div>'
    + '</div>';

  h += '<div class="card"><p class="sec-h">笔记层级模式</p>'
    + '<div class="shint">层级模式决定树上每一层对应哪个 LaTeX 标题命令 —— '
    + '标题从哪个命令里取（`\\chapter` / `\\section` / `\\subsection`），'
    + '以及怎么编号（`1.1`、`1.1.2`、`附录 A`、`A.1`）都由它决定。'
    + '下拉选项与「新建大纲」是同一套。默认「自动识别」：按 main.tex 最外层的标题命令'
    + '与树的层数推断。改动后立即重扫（数秒）。</div>';

  h += '<table><thead><tr><th>笔记</th><th>层级模式</th><th>依据</th><th></th>'
    + '</tr></thead><tbody>';
  notes.forEach((n) => {
    const cur = n.level_source === "manual" ? (n.level_mode || "") : "auto";
    let opts = "";
    modes.forEach((m) => {
      const sel = (m.id === cur) ? " selected" : "";
      const text = m.cmds ? (m.names + "　" + m.cmds) : m.names;
      opts += '<option value="' + esc(m.id) + '"' + sel + '>' + esc(text) + '</option>';
    });
    /* 手动写进设置文件的模式未必在下拉清单里，补一项，免得下拉显示成别的值 */
    if (cur !== "auto" && !modes.some((m) => m.id === cur)) {
      opts = '<option value="' + esc(cur) + '" selected>自定义　' + esc(cur)
        + "</option>" + opts;
    }
    const manual = n.level_source === "manual";
    h += '<tr><td>' + esc(n.title)
      + '<div class="shint">' + esc(n.name) + '</div></td>'
      + '<td><select data-level-note="' + esc(n.name) + '">' + opts + '</select></td>'
      + '<td><span class="badge' + (manual ? " man" : "") + '">'
      + (manual ? "指定" : "自动") + '</span>'
      + '<div class="shint">' + esc(n.level_hint || "") + '</div></td>'
      + '<td>' + (manual
          ? '<span class="tbtn" data-reset-level="' + esc(n.name) + '">恢复自动</span>'
          : '') + '</td></tr>';
  });
  h += '</tbody></table></div>';

  const anyManual = notes.some((n) => n.level_source === "manual");
  h += '<div class="card"><p class="sec-h">数据文件</p>'
    + '<div class="shint">设置写在 <span class="mono">progress_settings.json</span>，'
    + '三维标记 / 备注 / 待办 / 章级设置写在 <span class="mono">progress_marks.json</span>，'
    + '两者与本工具同目录、彼此分开存放；删掉即恢复默认。</div>'
    + (anyManual ? '<div class="p-btns"><button id="btnAllAuto">'
        + '全部恢复自动识别</button></div>' : '')
    + '<div class="p-btns">'
    + '<button id="btnMarksExport">导出标记数据</button>'
    + '<button id="btnMarksImport">导入标记数据</button>'
    + '<input type="file" id="marksFile" accept=".json,application/json" hidden>'
    + '</div>'
    + '<div class="shint">导入按 <b>updated</b> 时间戳合并：较新的一份覆盖冲突项，'
    + '只有一侧有的记录一律保留，不会丢掉任何一边的标记。</div>'
    + '</div>';

  box.innerHTML = h;
}

/* ============================ 欠账页 ============================ */
/* 清单由前端直接从树里汇总 —— 四类来源的字段本来就都在 /api/data 里，
   范围口径与服务端一致：node.excluded 为真的一律不进清单。 */

function nodeLabel(node) {
  const raw = node.view_title || node.name || "";
  return (node.num ? node.num + " " : "") + raw;
}

/* 停滞天数的参照时刻取「扫描时刻」，不取 Date.now() ——
   同一份数据算出来的数字应当稳定，不随页面开着多久而漂。 */
function scanRefMs() {
  const t = S.data && S.data.scanned_at ? Date.parse(S.data.scanned_at) : NaN;
  return isNaN(t) ? Date.now() : t;
}

function daysSince(sec) {
  if (!sec) return null;
  return Math.max(0, Math.floor((scanRefMs() - sec * 1000) / 86400000));
}

function fmtDay(sec) {
  if (!sec) return "—";
  const dt = new Date(sec * 1000);
  const p = (x) => (x < 10 ? "0" : "") + x;
  return dt.getFullYear() + "-" + p(dt.getMonth() + 1) + "-" + p(dt.getDate());
}

/* 欠账四源。返回的每条都带 note / node / crumbs / topId ——
   crumbs 用于面包屑，topId 用于统计页按章分组。 */
function collectPending(d) {
  const out = [];
  if (!d) return out;
  (d.notes || []).forEach((n) => {
    (n.tops || []).forEach((top) => {
      const dig = (node, crumbs) => {
        if (node.excluded) return;                 // 只统计计入范围内的
        const here = crumbs.concat([nodeLabel(node)]);
        if (node.type === "leaf") {
          const mk = node.marks || {};
          const dims = MARK_DIMS.filter((k) => mk[k] === "todo");
          if (dims.length) {
            out.push({src: "mark", note: n, node: node, dims: dims,
                      crumbs: here, topId: top.id});
          }
          (node.todos || []).forEach((t, i) => {
            if (!t.done) {
              out.push({src: "todo", note: n, node: node, idx: i, text: t.text,
                        crumbs: here, topId: top.id});
            }
          });
          if (node.planned) {
            out.push({src: "plan", note: n, node: node, crumbs: here, topId: top.id});
          }
        } else if (node.type === "dir") {
          if (node.chapter_mark) {
            out.push({src: "chapter", note: n, node: node, crumbs: here,
                      topId: top.id});
          }
          (node.children || []).forEach((c) => dig(c, here));
        }
      };
      dig(top, []);
    });
  });
  return out;
}

function ledgerItems() {
  const rows = collectPending(S.data).filter((x) => S.ledgerSrc.has(x.src)
    && (S.ledgerNote === "__all__" || x.note.name === S.ledgerNote));
  if (S.ledgerSort === "stale") {
    rows.sort((a, b) => (a.node.last_mtime || 0) - (b.node.last_mtime || 0));
  }
  return rows;
}

let ledgerRows = [];      // 与当前渲染的 DOM 一一对应，行内动作按序号取回原始条目

function renderLedgerNoteSel() {
  const box = document.getElementById("ledgerNote");
  if (!box) return;
  if (!S.data) { box.innerHTML = ""; return; }
  let opts = '<option value="__all__"'
    + (S.ledgerNote === "__all__" ? " selected" : "") + '>全部笔记</option>';
  (S.data.notes || []).forEach((n) => {
    opts += '<option value="' + esc(n.name) + '"'
      + (S.ledgerNote === n.name ? " selected" : "") + '>' + esc(n.title) + '</option>';
  });
  box.innerHTML = '<span class="note-pick"><select data-lnote="1" title="只看某一本">'
    + opts + '</select></span>';
}

function ledgerRowHTML(x, i) {
  const d = daysSince(x.node.last_mtime);
  const limit = S.data.stagnant_days || 14;
  const over = (d !== null && d >= limit) ? " over" : "";
  let text = "", act = "";
  if (x.src === "mark") {
    text = x.dims.map((k) => DIM_CN[k]).join(" · ") + " 待补";
    act = '<span class="ldims">' + MARK_DIMS.map((k) => {
      const todo = x.dims.indexOf(k) >= 0;
      return '<span class="mk" data-lmark="' + k + '" data-li="' + i + '" title="'
        + DIM_CN[k] + (todo ? "：待补，点一下标为已完成" : "：已完成") + '">'
        + (todo ? SVG_CIRCLE : SVG_CHECK) + '</span>';
    }).join("") + '</span>';
  } else if (x.src === "todo") {
    text = "待办：" + x.text;
    act = '<span class="tbox" data-ltodo="' + i + '" title="勾选完成"></span>';
  } else if (x.src === "plan") {
    text = "已设为下一步";
    act = '<span class="tbtn" data-lplan="' + i + '">取消下一步</span>';
  } else {
    text = "整章待补";
    act = '<span class="tbtn" data-lchapter="' + i + '">取消整章待补</span>';
  }
  return '<div class="lrow" data-lid="' + esc(x.node.id) + '" data-lsrc="' + x.src + '">'
    + '<span class="lsrc s-' + x.src + '">' + LEDGER_CN[x.src] + '</span>'
    + '<span class="lmain" data-lgoto="' + i + '" title="跳到明细页并定位到这一节">'
    + '<span class="lcrumb">' + esc(x.note.title) + " › "
    + x.crumbs.map(esc).join(" › ") + '</span>'
    + '<span class="ltext">' + esc(text) + '</span></span>'
    + '<span class="lmeta mono' + over + '" title="最后修改 ' + fmtDay(x.node.last_mtime)
    + '">' + (d === null ? "无记录" : d + " 天未动") + '</span>'
    + act + '</div>';
}

function renderLedger() {
  const box = document.getElementById("ledgerBox");
  const cnt = document.getElementById("ledgerCount");
  if (!box) return;
  if (!S.data) { box.innerHTML = ""; if (cnt) cnt.textContent = ""; return; }
  renderLedgerNoteSel();
  const total = collectPending(S.data).length;
  ledgerRows = ledgerItems();
  if (cnt) {
    cnt.textContent = "共 " + ledgerRows.length + " 条"
      + (ledgerRows.length === total ? "" : "（全部 " + total + " 条）");
  }
  if (!ledgerRows.length) {
    box.innerHTML = '<div class="card"><div class="empty">'
      + (total ? "当前筛选下没有条目" : "全库无欠账") + '</div></div>';
    return;
  }
  let h = '<div class="card">';
  ledgerRows.forEach((x, i) => { h += ledgerRowHTML(x, i); });
  box.innerHTML = h + '</div>';
}

function ledgerToggleMark(i, dim) {
  const x = ledgerRows[i];
  if (!x) return;
  const cur = (x.node.marks || {})[dim] || "done";
  postJSON(API.entry, {id: x.node.id, marks: {[dim]: cur === "done" ? "todo" : "done"}})
    .then((d) => { S.data = d; refreshAll(); })
    .catch(() => setSvc(false));
}

function ledgerDoneTodo(i) {
  const x = ledgerRows[i];
  if (!x) return;
  const todos = (x.node.todos || []).map((t, k) => ({
    text: t.text, done: (k === x.idx) ? true : !!t.done,
  }));
  postJSON(API.entry, {id: x.node.id, todos: todos})
    .then((d) => { S.data = d; refreshAll(); })
    .catch(() => setSvc(false));
}

function ledgerUnplan(i) {
  const x = ledgerRows[i];
  if (!x) return;
  postJSON(API.entry, {id: x.node.id, planned: false})
    .then((d) => { S.data = d; refreshAll(); })
    .catch(() => setSvc(false));
}

function ledgerCancelChapter(i) {
  const x = ledgerRows[i];
  if (!x) return;
  postJSON(API.chapter, {id: x.node.id, mark: false})
    .then((d) => { S.data = d; refreshAll(); toast("已取消整章待补"); })
    .catch(() => setSvc(false));
}

/* 跳到明细页并展开定位 —— 欠账页一半的价值在这里：从欠账直接回到结构位置 */
function gotoNode(noteName, id) {
  const ns = (S.data && S.data.notes) || [];
  const idx = ns.findIndex((n) => n.name === noteName);
  if (idx >= 0) S.noteIdx = idx;
  S.open = new Set();
  S.selected = null;
  S.panelMode = "detail";
  S.filter = "all";
  S.query = "";
  S.search = null;
  const qi = document.getElementById("q");
  if (qi) qi.value = "";
  document.querySelectorAll("#filterSel button").forEach((b) => {
    b.classList.toggle("on", b.dataset.f === "all");
  });
  const n = currentNote();
  let hit = false;
  const dig = (node, path) => {
    if (hit) return;
    const here = path.concat([node.id]);
    if (node.id === id) { path.forEach((p) => S.open.add(p)); hit = true; return; }
    (node.children || []).forEach((c) => dig(c, here));
  };
  ((n && n.tops) || []).forEach((t) => dig(t, []));
  if (hit) S.selected = id;
  switchView("detail");
  refreshAll();
}

/* ============================ 统计页 ============================ */
/* 不引图表库（本工具对外的承诺是「不联网、不上传」，前端零外链）：
   长条类图直接用 HTML/CSS，折线与环形手写 SVG。 */

const STATS_SERIES = [
  {k: "envs", label: "平均每节环境数",
   calc: (s) => (s.written ? s.envs / s.written : null),
   fmt: (v) => v.toFixed(2)},
  {k: "body", label: "正文占比",
   calc: (s) => (s.chars ? s.body_chars / s.chars * 100 : null),
   fmt: (v) => v.toFixed(1) + "%"},
  {k: "chars", label: "平均每节字数",
   calc: (s) => (s.written ? s.chars / s.written : null),
   fmt: (v) => fmtInt(Math.round(v))},
];

function mergeEnvNames(list) {
  const out = {};
  (list || []).forEach((e) => {
    Object.keys(e || {}).forEach((k) => { out[k] = (out[k] || 0) + e[k]; });
  });
  return out;
}

/* 范围 → x 轴单位：全库时是笔记，单本时是该笔记的章（顶层节点）。
   三张对比图共用这个单位，口径一处定义、三处复用。 */
function statsUnits() {
  const d = S.data;
  if (!d) return [];
  if (S.statsScope === "__all__") {
    return (d.notes || []).map((n) => ({
      key: n.name, label: n.title, noteName: n.name,
      stats: n.counted || {},
      /* 环境构成也只看计入范围内的章 —— 与图 1 / 图 3（以及单本范围）同口径，
         否则未启用章的环境会被算进来，和别的图对不上。 */
      envNames: mergeEnvNames((n.tops || []).filter((t) => t.decision)
        .map((t) => (t.stats || {}).env_names)),
      /* 展开下一层：全库 → 该笔记的章 */
      children: (n.tops || []).filter((t) => t.decision),
    }));
  }
  const n = (d.notes || []).find((x) => x.name === S.statsScope);
  if (!n) return [];
  return (n.tops || []).filter((t) => t.decision).map((t) => ({
    key: t.id, label: nodeLabel(t), noteName: n.name,
    stats: t.stats || {},
    envNames: (t.stats || {}).env_names || {},
    /* 展开下一层：单本 → 该章的节。这里**不按计入范围过滤** ——
       章行的数字是该章子树的汇总，列出的下一层必须能逐项加回章行。 */
    children: t.children || [],
  }));
}

/* 顶层的「第1章：集合论」太长，坐标轴上只留标题本身 */
function shortLabel(s, n) {
  const t = String(s == null ? "" : s)
    .replace(/^第[\d一二三四五六七八九十]+\s*(章|部分|节)[：:]\s*/, "");
  return t.length > n ? t.slice(0, n) + "…" : t;
}

function renderStatsScope() {
  const box = document.getElementById("statsScope");
  if (!box || !S.data) return;
  let h = '<span class="sel" style="flex-wrap:wrap">'
    + '<button data-sscope="__all__" class="'
    + (S.statsScope === "__all__" ? "on" : "") + '">全库</button>';
  (S.data.notes || []).forEach((n) => {
    h += '<button data-sscope="' + esc(n.name) + '" class="'
      + (S.statsScope === n.name ? "on" : "") + '">' + esc(n.title) + '</button>';
  });
  box.innerHTML = h + '</span>';
}

function chartStatusHTML(units) {
  let h = '<div class="card"><p class="sec-h">状态构成'
    + '<span class="hint" style="font-weight:400">　每条 = '
    + (S.statsScope === "__all__" ? "一本笔记" : "一章")
    + '，按规划小节数归一</span></p>'
    + '<div class="statLeg">'
    + '<span><i style="background:var(--blue)"></i>已写</span>'
    + '<span><i style="background:var(--gray-mid)"></i>空壳：文件已建、内容为空</span>'
    + '<span><i style="background:var(--gray-dark)"></i>未建：索引已规划、文件未创建</span>'
    + '</div>';
  units.forEach((u) => {
    const s = u.stats || {};
    const tot = Math.max(s.planned || 0, 1);
    const pc = s.planned ? Math.round((s.written || 0) / s.planned * 1000) / 10 : 0;
    h += '<div class="statsUnit">'
      + '<span class="sun" title="' + esc(u.label) + '">' + esc(u.label) + '</span>'
      + '<span class="sbar bar">'
      + '<span class="sw" style="width:' + ((s.written || 0) / tot * 100) + '%"></span>'
      + '<span class="se" style="width:' + ((s.empty || 0) / tot * 100) + '%"></span>'
      + '<span class="sm" style="width:' + ((s.missing || 0) / tot * 100) + '%"></span>'
      + '</span>'
      + '<span class="snum mono">' + fmtInt(s.written) + " / " + fmtInt(s.planned)
      + '　' + pc + '%</span></div>';
  });
  return h + '</div>';
}

/* 横轴标签：章用「第N章」，笔记模式退回短标题 ——
   短标签才可能每一条都显示得下，完整标题放在图下方的清单里。 */
function axisLabel(u) {
  const m = /^(第[\d一二三四五六七八九十]+[章部分])/.exec(u.label || "");
  return m ? m[1] : shortLabel(u.label, 6);
}

function chartLineSVG(units) {
  const ser = STATS_SERIES.filter((x) => x.k === S.statsSeries)[0] || STATS_SERIES[0];
  const n = units.length;
  const vals = units.map((u) => ser.calc(u.stats || {}));
  const have = vals.map((v) => v !== null && isFinite(v));
  const avail = vals.filter((v, i) => have[i]);

  let h = '<div class="card"><p class="sec-h">' + esc(ser.label) + '</p>'
    + '<div class="statLeg">'
    + STATS_SERIES.map((x) => '<span class="tbtn" data-serie="' + x.k + '"'
        + (x.k === ser.k ? ' style="background:var(--bg3);color:var(--fg)"' : '')
        + '>' + esc(x.label) + '</span>').join("")
    + '</div>';
  if (!avail.length) {
    S.lineGeo = null;
    return h + '<div class="empty">没有可画的数据（分母为 0 的单位没有数据）</div></div>';
  }

  /* 每个单位占固定宽度，整体超出就横向滚动 —— 这样标签不会被裁掉，
     也不必为了塞下标签而隔一个跳一个。 */
  const STEP = 64, PL = 58, PR = 26, PT = 18, PB = 40, H = 216;
  const W = Math.max(560, PL + Math.max(n - 1, 1) * STEP + PR);
  const xAt = (i) => (n === 1 ? PL + (W - PL - PR) / 2 : PL + i * STEP);
  let mx = Math.max.apply(null, avail), mn = Math.min.apply(null, avail);
  if (mx === mn) mx = mn + (mn === 0 ? 1 : Math.abs(mn) * 0.2);
  if (mn > 0 && mn / mx > 0.5) mn = 0;      // 差异很小时从 0 起，免得把噪声放大
  const yAt = (v) => PT + (1 - (v - mn) / (mx - mn || 1)) * (H - PT - PB);

  let g = "";
  [mx, (mx + mn) / 2, mn].forEach((v) => {
    const y = yAt(v).toFixed(1);
    g += '<line class="gridL" x1="' + PL + '" y1="' + y + '" x2="' + (W - PR)
      + '" y2="' + y + '"></line>'
      + '<text class="axisT" x="' + (PL - 8) + '" y="' + (Number(y) + 3.5)
      + '" text-anchor="end">' + esc(ser.fmt(v)) + '</text>';
  });

  /* 折线在缺口处断开：没有数据的单位不画点，也不跨过它连线 */
  const segs = [];
  let seg = [];
  have.forEach((ok, i) => {
    if (ok) seg.push({i: i, v: vals[i]});
    else if (seg.length) { segs.push(seg); seg = []; }
  });
  if (seg.length) segs.push(seg);
  segs.forEach((s) => {
    if (s.length < 2) return;
    g += '<polyline fill="none" stroke="var(--blue)" stroke-width="1.6" points="'
      + s.map((p) => xAt(p.i).toFixed(1) + "," + yAt(p.v).toFixed(1)).join(" ")
      + '"></polyline>';
  });
  have.forEach((ok, i) => {
    if (!ok) return;
    g += '<circle class="lineDot" cx="' + xAt(i).toFixed(1) + '" cy="'
      + yAt(vals[i]).toFixed(1) + '" r="3"></circle>';
  });

  g += '<line class="axis" x1="' + PL + '" y1="' + (H - PB) + '" x2="' + (W - PR)
    + '" y2="' + (H - PB) + '"></line>';
  units.forEach((u, i) => {
    g += '<text class="axisT axisX" x="' + xAt(i).toFixed(1) + '" y="' + (H - PB + 15)
      + '" text-anchor="middle">' + esc(axisLabel(u)) + '</text>';
  });
  g += '<line class="lineGuide" x1="0" y1="' + PT + '" x2="0" y2="' + (H - PB)
    + '" style="display:none"></line>';

  h += '<div class="chartWrap"><div class="chartInner" style="width:' + W + 'px">'
    + '<svg viewBox="0 0 ' + W + " " + H + '" width="' + W + '" height="' + H
    + '" role="img">' + g + '</svg><div class="cTip" hidden></div></div></div>';

  /* 图下方补完整标题：轴上只放得下「第N章」，这里给全名 */
  h += '<div class="lineLegend">'
    + units.map((u, i) => '<span class="ll">' + esc(u.label)
        + (have[i] ? "" : "<i>无数据</i>") + '</span>').join("")
    + '</div>';

  h += '<div class="chartCap">分母是「已写小节数」—— 用规划数会把未建的章拉低，'
    + '看不出这一章的内容性质。没有数据的单位不画点、折线在该处断开。'
    + '图宽随条目数增长，超出时可左右滚动；鼠标移到图上任意位置看具体数值。</div>';

  S.lineGeo = {pl: PL, step: STEP, n: n, pt: PT, pb: PB, h: H,
               xs: units.map((u, i) => xAt(i)),
               vals: vals, have: have, ser: ser,
               names: units.map((u) => u.label)};
  return h + '</div>';
}

/* 悬停：按横坐标就近取单位 —— 命中区是整个图，不必去够那些小圆点 */
function onLineHover(e) {
  const geo = S.lineGeo;
  const inner = e.currentTarget;
  if (!geo || !inner) return;
  const r = inner.getBoundingClientRect();
  const x = e.clientX - r.left;
  let i = Math.round((x - geo.pl) / geo.step);
  i = Math.max(0, Math.min(geo.n - 1, i));
  const cx = geo.xs[i];
  const guide = inner.querySelector(".lineGuide");
  if (guide) {
    guide.style.display = "";
    guide.setAttribute("x1", cx.toFixed(1));
    guide.setAttribute("x2", cx.toFixed(1));
  }
  const tip = inner.querySelector(".cTip");
  if (!tip) return;
  tip.innerHTML = '<div class="tt">' + esc(geo.names[i]) + '</div>'
    + '<div class="tv">' + esc(geo.ser.label) + "："
    + (geo.have[i] ? esc(geo.ser.fmt(geo.vals[i])) : "无数据") + '</div>';
  tip.hidden = false;
  const tw = tip.offsetWidth || 150;
  let left = cx + 14;
  if (left + tw > inner.clientWidth - 4) left = cx - tw - 14;
  tip.style.left = Math.max(4, left) + "px";
  tip.style.top = (geo.pt + 4) + "px";
}

function hideLineTip() {

function chartDebtHTML(units) {
  const by = {};
  collectPending(S.data).forEach((x) => {
    const key = (S.statsScope === "__all__") ? x.note.name : x.topId;
    const o = by[key] || (by[key] = {mark: 0, todo: 0, plan: 0, chapter: 0});
    o[x.src] += 1;
  });
  const keys = ["mark", "todo", "chapter", "plan"];
  let mx = 1;
  units.forEach((u) => {
    const o = by[u.key] || {};
    mx = Math.max(mx, keys.reduce((a, k) => a + (o[k] || 0), 0));
  });
  let h = '<div class="card"><p class="sec-h">欠账来源</p>'
    + '<div class="statLeg">'
    + '<span><i style="background:var(--orange)"></i>待补</span>'
    + '<span><i style="background:var(--orange);opacity:.7"></i>待办</span>'
    + '<span><i style="background:var(--orange);opacity:.45"></i>整章待补</span>'
    + '<span><i style="background:var(--blue)"></i>下一步（是计划，不是欠账）</span>'
    + '</div>';
  units.forEach((u) => {
    const o = by[u.key] || {mark: 0, todo: 0, plan: 0, chapter: 0};
    const total = keys.reduce((a, k) => a + (o[k] || 0), 0);
    let bar = "";
    keys.forEach((k) => {
      if (!o[k]) return;
      bar += '<span class="d-' + k + '" style="width:' + (o[k] / mx * 100) + '%"></span>';
    });
    const detail = keys.filter((k) => o[k])
      .map((k) => LEDGER_CN[k] + " " + o[k]).join(" · ");
    h += '<div class="statsUnit">'
      + '<span class="sun" title="' + esc(u.label) + '">' + esc(u.label) + '</span>'
      + '<span class="sbar bar">' + bar + '</span>'
      + '<span class="snum mono" title="' + esc(detail) + '">' + total + ' 条</span></div>';
  });
  h += '<div class="chartCap">只统计计入范围内的条目，与「欠账」页同源（同一个汇总函数）。'
    + '「下一步」用蓝色另列 —— 它是主动计划，不是欠账。</div>';
  return h + '</div>';
}

/* 环境构成明细表的一行。label 传**已转义**的 HTML（可能带未启用标签）；
   数字取该节点子树的汇总，与明细页「定理环境 N 个」同源。 */
function envRowHTML(labelHTML, envNames, o) {
  o = o || {};
  const env = envNames || {};
  const tops = o.topKeys || [], rests = o.restKeys || [];
  const other = rests.reduce((a, k) => a + (env[k] || 0), 0);
  const total = Object.keys(env).reduce((a, k) => a + (env[k] || 0), 0);
  const caret = o.nKids
    ? '<span class="caret" data-envopen="' + esc(o.key) + '" title="展开下一层">'
      + (o.open ? "▾" : "▸") + '</span>'
    : '<span class="caret leaf"></span>';
  const cls = [o.depth ? "sub" : "", o.cls || ""].join(" ").trim();
  let h = "<tr" + (cls ? ' class="' + cls + '"' : "")
    + (o.key ? ' data-envk="' + esc(o.key) + '"' : "") + ">"
    + '<td class="lb">' + caret + labelHTML + "</td>";
  tops.forEach((k) => {
    const v = env[k] || 0;
    h += '<td class="' + (v ? "" : "z") + '">' + (v ? fmtInt(v) : "·") + "</td>";
  });
  if (rests.length) {
    h += '<td class="' + (other ? "" : "z") + '">' + (other ? fmtInt(other) : "·")
      + "</td>";
  }
  return h + '<td class="mono">' + fmtInt(total) + "</td></tr>";
}

/* 未启用的顶层章：不计入进度统计，但明细页照常显示它们的数字。
   平铺成一份列表，单独成块列在表尾 —— 这样「结构汇总」与「进度统计」两套口径的
   差异是看得见的，而不是两个页面各说各话。 */
function envOffRows() {
  const d = S.data;
  if (!d) return [];
  const all = S.statsScope === "__all__";
  const notes = all ? (d.notes || [])
    : (d.notes || []).filter((n) => n.name === S.statsScope);
  const out = [];
  notes.forEach((n) => {
    (n.tops || []).filter((t) => !t.decision).forEach((t) => {
      out.push({
        key: t.id,
        label: (all ? n.title + " · " : "") + nodeLabel(t),
        envNames: (t.stats || {}).env_names || {},
        children: t.children || [],
      });
    });
  });
  return out;
}

function chartEnvSVG(units) {
  const merged = mergeEnvNames(units.map((u) => u.envNames));
  const ent = Object.keys(merged).filter((k) => merged[k] > 0)
    .map((k) => ({k: k, v: merged[k]})).sort((a, b) => b.v - a.v);
  let h = '<div class="card"><p class="sec-h">定理环境构成</p>';
  if (!ent.length) return h + '<div class="empty">没有环境数据</div></div>';
  const restV = ent.slice(5).reduce((a, x) => a + x.v, 0);
  const items = ent.slice(0, 5).concat(restV ? [{k: "__other__", v: restV}] : []);
  const tot = items.reduce((a, x) => a + x.v, 0);
  const R = 54, C = 2 * Math.PI * R;
  let off = 0, rings = "";
  items.forEach((x, i) => {
    const frac = x.v / tot;
    rings += '<circle class="dn' + Math.min(i, 5) + '" cx="70" cy="70" r="' + R
      + '" fill="none" stroke-width="20" stroke-dasharray="'
      + (frac * C).toFixed(2) + " " + (C - frac * C).toFixed(2)
      + '" stroke-dashoffset="' + (-off * C).toFixed(2)
      + '" transform="rotate(-90 70 70)"></circle>';
    off += frac;
  });
  const svg = '<svg viewBox="0 0 140 140" width="140" height="140" role="img">'
    + rings
    + '<text x="70" y="67" text-anchor="middle" style="font-size:18px;fill:var(--fg)">'
    + fmtInt(tot) + '</text>'
    + '<text x="70" y="85" text-anchor="middle" style="font-size:10px;fill:var(--fg3)">'
    + '个环境</text></svg>';
  let leg = '<div class="envLeg">';
  items.forEach((x, i) => {
    leg += '<div class="li"><i class="cb dnChip' + Math.min(i, 5) + '"></i>'
      + '<span class="nm">' + esc(x.k === "__other__" ? "其他" : (ENV_CN[x.k] || x.k)) + '</span>'
      + '<span class="v mono">' + fmtInt(x.v) + "　" + (x.v / tot * 100).toFixed(1)
      + '%</span></div>';
  });
  h += '<div class="donutWrap">' + svg + leg + '</div>';

  /* 构成明细：粒度跟随范围（全库 → 笔记 / 章，单本 → 章 / 节），行首三角展开下一层。
     每行取该节点子树的汇总 —— 与明细页点开该节点看到的「定理环境 N 个」同源，
     所以逐级相加都能对上。 */
  const sumEnv = {};
  units.forEach((u) => {
    Object.keys(u.envNames || {}).forEach((k) => {
      sumEnv[k] = (sumEnv[k] || 0) + (u.envNames[k] || 0);
    });
  });
  const keys = Object.keys(sumEnv).sort((a, b) => sumEnv[b] - sumEnv[a]);
  const topKeys = keys.slice(0, 6);
  const restKeys = keys.slice(6);
  const base = {topKeys: topKeys, restKeys: restKeys};
  let rows = "";
  units.forEach((u) => {
    const kids = u.children || [];
    const open = S.envOpen.has(u.key);
    rows += envRowHTML(esc(u.label), u.envNames,
      Object.assign({}, base, {key: u.key, nKids: kids.length, open: open}));
    if (kids.length && open) {
      kids.forEach((c) => {
        rows += envRowHTML(esc(nodeLabel(c))
          + (c.excluded ? '<span class="tag-un">未启用</span>' : ""),
          ((c.stats || {}).env_names) || {},
          Object.assign({}, base, {depth: 1, key: c.id}));
      });
    }
  });
  rows += envRowHTML("计入范围合计", sumEnv, Object.assign({}, base, {cls: "sum"}));

  /* 未启用块：默认收起，免得十几行 0 占版面；展开后才看具体是哪几章 */
  const offRows = envOffRows();
  const cols = topKeys.length + (restKeys.length ? 1 : 0) + 2;
  if (offRows.length) {
    const offTotal = {};
    offRows.forEach((r) => {
      Object.keys(r.envNames || {}).forEach((k) => {
        offTotal[k] = (offTotal[k] || 0) + (r.envNames[k] || 0);
      });
    });
    const offSum = Object.keys(offTotal).reduce((a, k) => a + offTotal[k], 0);
    const offOpen = S.envOpen.has("__off__");
    rows += '<tr class="offHead" data-envopen="__off__"><td colspan="' + cols + '">'
      + (offOpen ? "▾" : "▸") + " 未启用（不计入）：" + offRows.length + " 章 · 环境 "
      + fmtInt(offSum) + ' 个<span class="hint">　明细页照常显示它们的数字</span></td></tr>';
    if (offOpen) {
      offRows.forEach((r) => {
        const kids = r.children || [];
        rows += envRowHTML(esc(r.label), r.envNames,
          Object.assign({}, base, {key: r.key, nKids: kids.length, cls: "off",
                                   open: S.envOpen.has(r.key)}));
        if (kids.length && S.envOpen.has(r.key)) {
          kids.forEach((c) => {
            rows += envRowHTML(esc(nodeLabel(c))
              + (c.excluded ? '<span class="tag-un">未启用</span>' : ""),
              ((c.stats || {}).env_names) || {},
              Object.assign({}, base, {depth: 1, key: c.id, cls: "off"}));
          });
        }
      });
      rows += envRowHTML("未启用合计", offTotal,
        Object.assign({}, base, {cls: "sum off"}));
    }
  }
  h += '<div class="envTblWrap"><table class="envTbl"><thead><tr>'
    + '<th class="lb">' + (S.statsScope === "__all__" ? "笔记 / 章" : "章 / 节") + "</th>"
    + topKeys.map((k) => "<th>" + esc(ENV_CN[k] || k) + "</th>").join("")
    + (restKeys.length ? "<th>其他</th>" : "")
    + "<th>合计</th></tr></thead><tbody>" + rows + "</tbody></table></div>";

  h += '<div class="chartCap">环形只标前 5 类，其余并入「其他」。'
    + "下表按" + (S.statsScope === "__all__" ? "笔记" : "章")
    + "列出构成，点行首的三角展开下一层；每行是该节点<b>整棵子树</b>的汇总 —— "
    + "与明细页点开该节点看到的「定理环境」同源，逐级相加都能对上。"
    + "表尾的「未启用」块列出被排除的章（默认收起）：它们的环境算在自己那行里，"
    + "但既不进「计入范围合计」也不进环形 —— 明细页照常显示它们的数字。</div>";
  return h + '</div>';
}

function renderStats() {
  const box = document.getElementById("statsBox");
  const hint = document.getElementById("statsHint");
  if (!box) return;
  if (!S.data) { box.innerHTML = ""; if (hint) hint.textContent = ""; return; }
  renderStatsScope();
  const units = statsUnits();
  if (hint) {
    const sn = (S.data.notes || []).filter((x) => x.name === S.statsScope)[0];
    hint.textContent = S.statsScope === "__all__"
      ? "x 轴单位：笔记（" + units.length + " 本）"
      : "x 轴单位：" + ((sn && sn.top_name) || "章") + "（" + units.length + " 个）";
  }
  if (!units.length) {
    box.innerHTML = '<div class="empty">没有可统计的单元</div>';
    return;
  }
  box.innerHTML = chartStatusHTML(units) + chartLineSVG(units)
    + chartDebtHTML(units) + chartEnvSVG(units);
  /* 折线图的悬停要等元素就位再绑（每次重渲染都会换掉它们） */
  const ci = box.querySelector(".chartInner");
  if (ci) {
    ci.addEventListener("mousemove", onLineHover);
    ci.addEventListener("mouseleave", hideLineTip);
  }
}

/* 正文检索要问服务端：等输入停下来再发，免得每敲一个字都请求一次 */
function scheduleBodySearch() {
  if (searchTimer) clearTimeout(searchTimer);
  if (!S.bodySearch || !S.query) {
    const had = !!S.search;
    S.search = null;
    if (had) { renderTree(); renderPanel(); }
    else { updateHits(currentNote(), queryTerms().length > 0); }
    return;
  }
  searchTimer = setTimeout(runBodySearch, 250);
}

async function runBodySearch() {
  const q = S.query;
  if (!q) return;
  let r = null;
  try {
    r = await postJSON(API.search, {q: q});
  } catch (err) {
    /* 请求失败时要把旧结果清掉：否则树上的「正文 N」与计数器仍按上一个词渲染，
       看着像是新词的命中。 */
    if (S.search) { S.search = null; renderTree(); renderPanel(); }
    return;
  }
  /* 期间输入又变了、或用户已把范围切回「仅标题」（那时不该再采用正文结果），
     这次结果都作废。 */
  if (q !== S.query || !S.bodySearch) return;
  r.byId = {};
  (r.results || []).forEach((x) => { r.byId[x.id] = x; });
  S.search = r;
  renderTree();
  renderPanel();
}

    e.stopPropagation();
    toggleMark(mk.dataset.id, mk.dataset.mark);
