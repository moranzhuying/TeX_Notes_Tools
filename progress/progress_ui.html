});

document.getElementById("view-stats").addEventListener("click", (e) => {
  const eo = e.target.closest("[data-envopen]");
  if (eo) {
    const k = eo.dataset.envopen;
    if (S.envOpen.has(k)) S.envOpen.delete(k); else S.envOpen.add(k);
    renderStats();
    return;
  }
  const sc = e.target.closest("[data-sscope]");
  if (sc) { S.statsScope = sc.dataset.sscope; renderStats(); return; }
  const se = e.target.closest("[data-serie]");
  if (se) { S.statsSeries = se.dataset.serie; renderStats(); }
});

document.getElementById("btnUnusedToggle").addEventListener("click", (e) => {
  setShowUnused(!S.showUnused);
});

document.getElementById("settingsBox").addEventListener("click", (e) => {
  if (e.target.closest("#swUnused")) { setShowUnused(!S.showUnused); return; }
  const r = e.target.closest("[data-reset-level]");
  if (r) { setNoteLevel(r.dataset.resetLevel, "auto"); return; }
  if (e.target.closest("#btnAllAuto")) setAllAuto();
  if (e.target.closest("#btnMarksExport")) { exportMarks(); return; }
  if (e.target.closest("#btnMarksImport")) {
    const f = document.getElementById("marksFile");
    if (f) f.click();
    return;
  }
});

document.getElementById("settingsBox").addEventListener("change", (e) => {
  const sel = e.target.closest("select[data-level-note]");
  if (sel) setNoteLevel(sel.dataset.levelNote, sel.value);
  if (e.target.id === "marksFile") {
    importMarks(e.target.files && e.target.files[0]);
    e.target.value = "";
  }
});

function exportMarks() {
  window.location.href = API.marksExport;
  toast("正在下载标记数据…");
}

async function importMarks(file) {
  if (!file) return;
  let obj = null;
  try {
    obj = JSON.parse(await file.text());
  } catch (err) {
    toast("导入失败：文件不是有效的 JSON");
    return;
  }
  try {
    const d = await postJSON(API.marksImport, {marks: obj});
    S.data = d;
    S.selected = null;
    refreshAll();
    const m = d.merged || {};
    toast("已导入：本地共 " + (m.entries || 0) + " 条小节标记"
      + (m.added ? "（新增 " + m.added + " 条）" : ""));
  } catch (err) {
    toast("导入失败：服务未响应或文件格式不符");
  }
}

/* 显示开关与层级模式都持久化在服务端（progress_settings.json） */
function setShowUnused(v) {
  toast(v ? "明细页将一并显示未启用的章（灰显，不计入统计）"
          : "明细页只显示计入范围内的条目");
  postJSON(API.settings, {show_unused: v})
    .then((d) => { S.data = d; applySettings(); refreshAll(); })
    .catch(() => { setSvc(false); toast("设置失败：服务未响应"); });
}

function setNoteLevel(name, mode) {
  toast("正在按新的层级模式重扫…", true);
  postJSON(API.settings, {note_levels: {[name]: mode}})
    .then((d) => {
      S.data = d;
      S.selected = null;
      applySettings();
      refreshAll();
      toast(mode === "auto" ? "已恢复自动识别" : "层级模式已更新");
    })
    .catch(() => { setSvc(false); toast("设置失败：服务未响应"); });
}

function setAllAuto() {
  const lv = {};
  (S.data.notes || []).forEach((n) => {
    if (n.level_source === "manual") lv[n.name] = "auto";
  });
  if (!Object.keys(lv).length) return;
  toast("正在恢复自动识别…", true);
  postJSON(API.settings, {note_levels: lv})
    .then((d) => {
      S.data = d;
      S.selected = null;
      applySettings();
      refreshAll();
      toast("已全部恢复自动识别");
    })
    .catch(() => { setSvc(false); toast("设置失败：服务未响应"); });
}

document.getElementById("resume").addEventListener("click", (e) => {
  if (e.target.closest("[data-goto-ledger]")) { switchView("ledger"); return; }
  if (e.target.closest("[data-clear-recent]")) {
    setRecentCut(Date.now());
    renderResume();
    toast("已清除「最近改动」；之后再有新的改动会重新出现");
    return;
  }
  const row = e.target.closest("[data-open-path]");
  if (!row) return;
  openFile(row.dataset.openPath);
});

function toggleMark(id, dim) {
  const n = currentNote();
  if (!n) return;
  let leaf = null;
  (n.tops || []).forEach((t) => {
    walkLeaves(t).forEach((l) => { if (l.id === id) leaf = l; });
  });
  if (!leaf) return;
  const cur = (leaf.marks || {})[dim] || "done";
  const nxt = cur === "done" ? "todo" : "done";
  postJSON(API.entry, {id: id, marks: {[dim]: nxt}})
    .then((d) => { S.data = d; refreshAll(); })
    .catch(() => setSvc(false));
}

function findNode(id) {
  const n = currentNote();
  if (!n) return null;
  let found = null;
  const dig = (node) => {
    if (found) return;
    if (node.id === id) { found = node; return; }
    (node.children || []).forEach(dig);
  };
  (n.tops || []).forEach(dig);
  return found;
}

/* 勾选 = 计入统计；取消勾选 = 该节点连同其子树一并排除 */
function toggleNode(id) {
  const node = findNode(id);
  if (!node) return;
  const mode = node.excluded ? "force_include" : "force_exclude";
  postJSON(API.chapter, {id: id, mode: mode})
    .then((d) => { S.data = d; refreshAll(); })
    .catch(() => setSvc(false));
}

function setChapterMode(id, mode) {
  postJSON(API.chapter, {id: id, mode: mode})
    .then((d) => { S.data = d; refreshAll(); })
    .catch(() => setSvc(false));
}

let toastTimer = null;
function toast(msg, sticky) {
  const el = document.getElementById("toast");
  if (!el) return;
  el.textContent = msg;
  el.classList.add("on");
  if (toastTimer) clearTimeout(toastTimer);
  if (!sticky) toastTimer = setTimeout(() => el.classList.remove("on"), 2200);
}

function openFile(path) {
  if (!path) { toast("没有可打开的文件路径"); return; }
  toast("正在用 TeXStudio 打开…", true);
  postJSON(API.open, {path: path})
    .then((r) => {
      toast(r.ok ? "已用 TeXStudio 打开" : ("打开失败：" + (r.message || "未知原因")));
    })
    .catch(() => toast("服务未响应，请确认服务仍在运行"));
}

document.getElementById("panel").addEventListener("click", (e) => {
  /* 正文检索结果：点条目打开源码 + PDF 预览层 */
  const hit = e.target.closest("[data-hit-id]");
  if (hit) {
    openViewer(hit.dataset.hitId, hit.dataset.hitNote, hit.dataset.hitTitle);
    return;
  }
  if (e.target.id === "btnFirstHit") {
    const x = (S.search && S.search.results || [])[0];
    if (x) openViewer(x.id, x.note, x.title);
    return;
  }
  const t = e.target.closest("[data-todo-toggle]");
  const d = e.target.closest("[data-todo-del]");
  if (t) { toggleTodo(parseInt(t.dataset.todoToggle, 10)); return; }
  if (d) { delTodo(parseInt(d.dataset.todoDel, 10)); return; }
  if (e.target.id === "btnOpen") {
    const lf = findSelectedLeaf();
    if (lf) openFile(lf.path);
    return;
  }
  if (e.target.id === "btnPlan") { togglePlan(); return; }
  if (e.target.id === "btnChapterMark") { toggleChapterMark(S.selected); return; }
  if (e.target.id === "btnProofAll") { markProofAll(); return; }
  const ch = e.target.closest("[data-chmode]");
  if (ch) { setChapterMode(ch.dataset.id, ch.dataset.chmode); return; }
});

document.getElementById("panel").addEventListener("keydown", (e) => {
  if (e.target.id === "todoNew" && e.key === "Enter") {
    const v = e.target.value.trim();
    if (v) addTodo(v);
  }
});

document.getElementById("panel").addEventListener("blur", (e) => {
  if (e.target.id === "noteBox") saveNote(e.target.value);
}, true);

function findSelectedLeaf() {
  const n = currentNote();
  if (!n || !S.selected) return null;
  let leaf = null;
  (n.tops || []).forEach((t) => {
    walkLeaves(t).forEach((l) => { if (l.id === S.selected) leaf = l; });
  });
  return leaf;
}

function saveNote(text) {
  if (!S.selected) return;
  postJSON(API.entry, {id: S.selected, note: text})
    .then((d) => { S.data = d; })
    .catch(() => setSvc(false));
}

function addTodo(text) {
  const leaf = findSelectedLeaf();
  if (!leaf) return;
  const todos = (leaf.todos || []).concat([{text: text, done: false}]);
  postJSON(API.entry, {id: S.selected, todos: todos})
    .then((d) => { S.data = d; refreshAll(); })
    .catch(() => setSvc(false));
}

function toggleTodo(i) {
  const leaf = findSelectedLeaf();
  if (!leaf) return;
  const todos = (leaf.todos || []).map((t, k) =>
    k === i ? {text: t.text, done: !t.done} : t);
  postJSON(API.entry, {id: S.selected, todos: todos})
    .then((d) => { S.data = d; refreshAll(); })
    .catch(() => setSvc(false));
}

function delTodo(i) {
  const leaf = findSelectedLeaf();
  if (!leaf) return;
  const todos = (leaf.todos || []).filter((t, k) => k !== i);
  postJSON(API.entry, {id: S.selected, todos: todos})
    .then((d) => { S.data = d; refreshAll(); })
    .catch(() => setSvc(false));
}

function togglePlan() {
  const leaf = findSelectedLeaf();
  if (!leaf) return;
  postJSON(API.entry, {id: S.selected, planned: !leaf.planned})
    .then((d) => { S.data = d; refreshAll(); })
    .catch(() => setSvc(false));
}

/* 章级待补：独立于小节汇总的手动标记 */
function toggleChapterMark(id) {
  const node = findNode(id || S.selected);
  if (!node || node.type === "leaf" || node.type === "missing") return;
  const on = !node.chapter_mark;
  postJSON(API.chapter, {id: node.id, mark: on})
    .then((d) => {
      S.data = d;
      refreshAll();
      toast(on ? "已标为整章待补" : "已取消整章待补");
    })
    .catch(() => setSvc(false));
}

/* 批量：把该层下「已写但无 proof / sketch」的小节的「证明」一次标为待补 */
function markProofAll() {
  const node = findNode(S.selected);
  if (!node || node.type === "leaf") return;
  const ids = walkLeaves(node).filter((l) => !l.excluded && l.status === "written"
      && !l.has_proof && !l.has_sketch && (l.marks || {}).proof !== "todo")
    .map((l) => l.id);
  if (!ids.length) { toast("这一层下没有需要标记的小节"); return; }
  postJSON(API.entry, {ids: ids, marks: {proof: "todo"}})
    .then((d) => {
      S.data = d;
      refreshAll();
      toast("已把 " + ids.length + " 个小节的「证明」标为待补");
    })
    .catch(() => setSvc(false));
}

document.addEventListener("keydown", (e) => {
  const tag = (e.target.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "textarea";
  if (e.key === "/" && !typing) {
    e.preventDefault();
    switchView("detail");
    const q = document.getElementById("q");
    q.focus();
    q.select();
  } else if (e.key === "Escape") {
    const v = document.getElementById("viewer");
    if (v && !v.hidden) { closeViewer(); return; }
    if (typing) { e.target.blur(); return; }
    if (S.selected) { S.selected = null; renderTree(); renderPanel(); }
  }
});

/* ============================ 初始化 ============================ */
(function init() {
  try {
    const t = localStorage.getItem("wb_progress_theme");
    if (t) document.documentElement.dataset.theme = t;
    const b = localStorage.getItem("wb_progress_bodyscope");
    if (b !== null) S.bodySearch = (b === "1");
  } catch (err) {}
  document.querySelectorAll("#scopeSel button").forEach((x) => {
    x.classList.toggle("on", (x.dataset.scope === "body") === S.bodySearch);
  });
  loadAndRender(false);
})();
</script>
</body>
</html>
